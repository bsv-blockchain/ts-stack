# coturn for local development and `pnpm test:turn` (see docker-compose.yml).
# Never deploy it: the shared secret below is public, and its peer rules are for one
# machine. Every option exists in coturn 4.18.0 (`docker run --rm <image> --help`).

# STUN and TURN on 3478, UDP and TCP, on every address in the container.
listening-port=3478
listening-ip=0.0.0.0

# Relayed addresses. Allocations relay from the container's fixed address (set in
# docker-compose.yml) and are advertised as 127.0.0.1, where Docker publishes the ports.
# coturn maps the advertised address back to the relay address, so one relayed peer
# reaches another inside the container: a peer only ever talks to 127.0.0.1:3478.
# Without the "/<relay address>" half the relay address is 0.0.0.0 and coturn refuses
# every peer with 403 Forbidden IP.
relay-ip=172.30.78.10
external-ip=127.0.0.1/172.30.78.10
min-port=49160
max-port=49200

# Ephemeral REST credentials only: username "<unix expiry>:<pseudonym>" and password
# base64(HMAC-SHA1(secret, username)), minted by the relay (server/turn.ts).
use-auth-secret
static-auth-secret=webrtpay-dev-secret
realm=webrtpay.local

fingerprint
no-tls
no-tcp-relay
no-multicast-peers
# Admin interfaces: 4.18.0 has no `no-cli`; the telnet CLI and the web admin are off
# unless `cli` or `web-admin` is set, and neither is.

# Never relay to private, loopback, link-local or reserved addresses (the same list as
# the production STUN deployment) ...
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# ... except coturn's own relay address, where a peer's 127.0.0.1 relayed candidate is
# mapped to (DEV ONLY). This replaces allow-loopback-peers, which these tests do not
# need: no peer address stays 127.0.0.1 after the mapping, and coturn's loopback is
# not the host's.
allowed-peer-ip=172.30.78.10

log-file=stdout
