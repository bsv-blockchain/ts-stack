codecov:
  require_ci_to_pass: yes
  notify:
    # The aggregate workflow uploads every coverage artifact in one batch.
    # Publish statuses only after that upload has finished processing so an
    # intermediate report cannot leave a stale patch-coverage result.
    manual_trigger: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        paths:
          - "packages/sdk/src/"

    patch:
      default:
        target: 90%
        threshold: 0%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "**/*.test.ts"
  - "**/*.vectors.ts"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/fixtures/**"
  - "**/benchmarks/**"
  - "**/coverage/**"
  - "**/dist/**"
  - "**/docs/**"
  - "**/scripts/**"
