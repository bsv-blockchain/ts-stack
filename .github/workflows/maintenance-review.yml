name: Maintenance review deadlines

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Review exception deadlines
        run: node scripts/repository-health.mjs --maintenance --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Review documentation deadlines
        if: ${{ !cancelled() }}
        run: node scripts/documentation-policy.mjs --all
