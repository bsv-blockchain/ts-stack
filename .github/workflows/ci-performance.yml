name: CI performance trend

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  trend:
    name: CI performance / 20-run trend and budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Compare the latest representative runs with the governed baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/ci-performance.mjs
          --collect
          --baseline governance/ci-performance-baseline.json
          --output ci-performance-report.json
          --execution-ledger-output ci-execution-ledger.json

      - name: Preserve the per-job and per-step trend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: ci-performance-report
          path: |
            ci-performance-report.json
            ci-execution-ledger.json
          if-no-files-found: error
          retention-days: 90
