name: Background mutation findings

# Independent, explicitly budgeted audits only. Never called by CI or publication.
on:
  workflow_dispatch:
    inputs:
      target:
        description: One exact governed target ID
        required: true
        type: string
      partition:
        description: One exact canonical partition ID (whole for an unpartitioned target)
        required: true
        type: string
        default: whole

permissions: {}

concurrency:
  group: background-mutation-findings
  cancel-in-progress: false

jobs:
  audit:
    name: Background audit / ${{ inputs.target }} / ${{ inputs.partition }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed main source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Validate explicit bounded selection before installation
        env:
          MUTATION_AUDIT_TARGET: ${{ inputs.target }}
          MUTATION_AUDIT_PARTITION: ${{ inputs.partition }}
        run: node scripts/mutation-findings.mjs validate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild audited build tool
        run: pnpm rebuild esbuild
      - name: Test background mutation planning and installed engine controls
        run: node --test scripts/background-tests/*.test.mjs scripts/mutation-partitions-engine.integration.mjs
      - name: Build required property graph
        run: pnpm build:property
      - name: Collect background mutation evidence
        env:
          MUTATION_AUDIT_TARGET: ${{ inputs.target }}
          MUTATION_AUDIT_PARTITION: ${{ inputs.partition }}
        run: node scripts/mutation-testing.mjs --target "$MUTATION_AUDIT_TARGET" --partition "$MUTATION_AUDIT_PARTITION"
      - name: Preserve available raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: background-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mutation
          if-no-files-found: ignore
          retention-days: 30

  findings:
    name: Record advisory findings
    if: always() && github.ref == 'refs/heads/main'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Publish metadata-only triage finding on unsuccessful audit
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_AUDIT_TARGET: ${{ inputs.target }}
          MUTATION_AUDIT_PARTITION: ${{ inputs.partition }}
          MUTATION_AUDIT_RESULT: ${{ needs.audit.result }}
        run: node scripts/mutation-findings.mjs report
