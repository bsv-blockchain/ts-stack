name: Property fuzzing

on:
  schedule:
    - cron: '31 7 * * 6'
  workflow_dispatch:
    inputs:
      runs:
        description: Generated cases per property (300-100000)
        required: false
        default: 5000
        type: number
      seed:
        description: Optional signed 32-bit fast-check seed
        required: false
        type: string
      path:
        description: Optional fast-check shrink path from a prior failure
        required: false
        type: string

permissions: {}

concurrency:
  group: property-fuzzing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-tests:
    name: Property fuzzing / ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: other-packages
            shard: 'all'
          - suite: output-knowledge
            shard: '1'
          - suite: output-knowledge
            shard: '2'
          - suite: output-knowledge
            shard: '3'
          - suite: output-knowledge
            shard: '4'
          - suite: output-knowledge
            shard: '5'
          - suite: output-knowledge
            shard: '6'
          - suite: output-knowledge
            shard: '7'
          - suite: output-knowledge
            shard: '8'
          - suite: wallet-toolbox
            shard: '1'
          - suite: wallet-toolbox
            shard: '2'
          - suite: wallet-toolbox
            shard: '3'
          - suite: wallet-toolbox
            shard: '4'
          - suite: lch
            shard: '1'
          - suite: lch
            shard: '2'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild the audited workspace build tool
        run: pnpm rebuild esbuild

      - name: Validate and configure the reproducible campaign
        env:
          REQUESTED_RUNS: ${{ inputs.runs || 5000 }}
          REQUESTED_SEED: ${{ inputs.seed || github.run_number }}
          REQUESTED_PATH: ${{ inputs.path || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const runs = Number(process.env.REQUESTED_RUNS)
          const seed = Number(process.env.REQUESTED_SEED)
          const path = process.env.REQUESTED_PATH ?? ''
          if (!Number.isSafeInteger(runs) || runs < 300 || runs > 100000) {
            throw new Error('runs must be a safe integer from 300 through 100000')
          }
          if (!Number.isInteger(seed) || seed < -2147483648 || seed > 2147483647) {
            throw new Error('seed must be a signed 32-bit integer')
          }
          if (path !== '' && !/^\d+(?::\d+)*$/.test(path)) {
            throw new Error('path must be a colon-delimited fast-check shrink path')
          }
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `FAST_CHECK_NUM_RUNS=${runs}\nFAST_CHECK_SEED=${seed}\nFAST_CHECK_PATH=${path}\n`
          )
          NODE

      - name: Verify the property test stand
        run: pnpm test:governance

      - name: Build and run the assigned property campaign
        env:
          PROPERTY_SUITE: ${{ matrix.suite }}
          PROPERTY_SHARD: ${{ matrix.shard }}
          JEST_SHARD_DURATIONS: ${{ github.workspace }}/governance/ci-lane-durations.json
        run: |
          set -euo pipefail
          {
            case "$PROPERTY_SUITE" in
              other-packages)
                pnpm build:property
                pnpm -r --workspace-concurrency=4 \
                  --filter '!@bsv/ts-stack' --filter '!@bsv/output-knowledge' --filter '!@bsv/wallet-toolbox' --filter '!@bsv/lch' \
                  --if-present run test:property
                ;;
              output-knowledge|wallet-toolbox)
                package="@bsv/$PROPERTY_SUITE"
                export JEST_SHARD_LANE=output-knowledge-tests
                shard_count=8
                if [[ "$PROPERTY_SUITE" == wallet-toolbox ]]; then
                  export JEST_SHARD_LANE=wallet-toolbox-coverage
                  shard_count=4
                fi
                pnpm -r --filter "$package..." run build
                pnpm --filter "$package" run test:property --shard="$PROPERTY_SHARD/$shard_count" \
                  --testSequencer="$GITHUB_WORKSPACE/scripts/jest-duration-sequencer.cjs"
                ;;
              lch)
                pnpm -r --filter '@bsv/lch...' run build
                pnpm --filter '@bsv/lch' run test:property --shard="$PROPERTY_SHARD/2"
                ;;
              *) exit 2 ;;
            esac
          } 2>&1 | tee property-tests.log

      - name: Record campaign replay details
        if: always()
        env:
          PROPERTY_SUITE: ${{ matrix.suite }}
          PROPERTY_SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "## Property fuzzing campaign"
            echo
            echo "- Suite: $PROPERTY_SUITE $PROPERTY_SHARD"
            echo "- Cases per property: \`${FAST_CHECK_NUM_RUNS:-unconfigured}\`"
            echo "- Seed: \`${FAST_CHECK_SEED:-unconfigured}\`"
            echo "- Shrink path: \`${FAST_CHECK_PATH:-<none>}\`"
            echo "- Replay: \`FAST_CHECK_NUM_RUNS=${FAST_CHECK_NUM_RUNS:-} FAST_CHECK_SEED=${FAST_CHECK_SEED:-} FAST_CHECK_PATH='${FAST_CHECK_PATH:-}' pnpm test:property\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the failing seed, shrink path, and counterexample log
        if: failure() && hashFiles('property-tests.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: property-fuzzing-failure-${{ github.run_id }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: property-tests.log
          if-no-files-found: error
          retention-days: 30
