name: Dependency lockfile refresh

# Dependabot's grouped stack-maintenance pull request bumps direct
# dependencies only. Once it opens, re-resolve every lockfile within the
# committed ranges and push one refresh commit onto that same pull request, so
# transitive patch and advisory fixes are reviewed by one CI run. The daily
# schedule is a cheap no-op until an unrefreshed grouped pull request exists.

on:
  schedule:
    - cron: '41 16 * * *'
  workflow_dispatch:
    inputs:
      pull-request:
        description: Grouped Dependabot pull request number (defaults to the open one)
        required: false
      force:
        description: Refresh again even if the pull request already carries a refresh commit
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Select the grouped Dependabot pull request
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.pull-request }}
          FORCE: ${{ inputs.force }}
          COMMIT_SUBJECT: 'chore(deps): refresh lockfiles within declared ranges'
        run: |
          # Security updates share the group's branch prefix; only the grouped
          # version pull request's title names the group.
          query='.[] | select(.author.login == "app/dependabot" and (.headRefName | startswith("dependabot-stack_maintenance-")) and (.title | contains("the \"stack-maintenance\" group")) and .isCrossRepository == false)'
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+$ ]]; then
              echo "::error::pull-request must be a number"
              exit 1
            fi
            query="$query | select(.number == $REQUESTED)"
          fi
          number=$(gh pr list --state open --author app/dependabot --limit 100 \
            --json number,author,headRefName,isCrossRepository,title --jq "$query | .number" | head -n 1)
          if [ -z "$number" ]; then
            echo "No open grouped Dependabot pull request."
            exit 0
          fi
          if [ "$FORCE" != "true" ] && gh pr view "$number" --json commits --jq '.commits[].messageHeadline' | grep -Fxq "$COMMIT_SUBJECT"; then
            echo "Pull request #$number already carries a lockfile refresh."
            exit 0
          fi
          {
            echo "number=$number"
            echo "branch=$(gh pr view "$number" --json headRefName --jq .headRefName)"
            echo "sha=$(gh pr view "$number" --json headRefOid --jq .headRefOid)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.number
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.target.outputs.number

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.target.outputs.number
        with:
          node-version: 24.x

      # No token is present while package managers resolve the graph; lifecycle
      # scripts are disabled inside the refresh script.
      - name: Refresh lockfiles within declared ranges
        id: refresh
        if: steps.target.outputs.number
        continue-on-error: true
        run: node scripts/dependency-lockfile-refresh.mjs --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Detect lockfile changes
        id: changes
        if: steps.target.outputs.number
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GitHub App token is required: commits pushed with GITHUB_TOKEN do
      # not trigger the pull request's CI.
      - name: Create refresh token
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the refresh commit
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT_SUBJECT: 'chore(deps): refresh lockfiles within declared ranges'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit --all --quiet --message "$COMMIT_SUBJECT" \
            --message "Manifests are unchanged; first-party @bsv/* resolutions are untouched."
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"

      - name: Report refresh failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error title=Lockfile refresh::One or more lockfiles could not be refreshed; see the job summary."
          exit 1
