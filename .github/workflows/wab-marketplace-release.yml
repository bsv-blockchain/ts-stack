name: WAB → AWS Marketplace

# Additive Marketplace path for infra/wab. Does NOT replace the general image release.
#
# Dual publish on the same `infra/v*` tag:
#   1. General OCI image → GHCR via .github/workflows/infra-release.yaml
#      (ghcr.io/<owner>/wab:v<version>) — for self-hosters and any registry consumers
#   2. This workflow → AWS Marketplace ECR + Catalog registration (listing only)
#
# VERSION SOURCE OF TRUTH: infra/wab/package.json `version` (same as infra-release.yaml).
# The `infra/v*` git tag is ONLY the trigger (date-based, e.g. infra/v2026-June-26) and is
# never parsed for a version. `version_override` is a manual escape hatch (e.g. a one-time
# catch-up), not the normal path.
#
# Naming mirrors the existing Marketplace listing:
#   package.json   X.Y.Z
#   Marketplace ECR tag  bsv-blockchain/wab:X.Y.Z   (bare, like wab:1.0.7)
#   Marketplace title    VersionTitle "vX.Y.Z"      (v-prefixed, like v1.0.7 / v1.0.8)
#   GHCR tag (separate)  ghcr.io/<owner>/wab:vX.Y.Z  (via infra-release.yaml)
#
# Prerequisites (seller account / repo settings — not provisioned by this workflow):
#   - Repo variable WAB_MP_ROLE_ARN: IAM role ARN in seller account (OIDC trust on
#     token.actions.githubusercontent.com, scoped to this repo; permissions for Marketplace
#     ECR push to 709825985650/bsv-blockchain/wab and marketplace-catalog Describe*/StartChangeSet).
#   - Job needs permissions.id-token: write for OIDC (no static AWS keys).
#
# IMPORTANT: this file MUST live in the repo ROOT .github/workflows/. GitHub never runs workflow
# files placed in subdirectories such as infra/wab/.github/workflows/.

on:
  push:
    tags:
      - 'infra/v*'          # same trigger as infra-release.yaml — the tag is only the trigger
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Manual escape hatch: publish this version instead of reading package.json'
        required: false
        default: ''

permissions: {}

concurrency:
  group: wab-marketplace-release
  cancel-in-progress: false   # never cancel a half-registered Catalog change set

env:
  AWS_REGION: us-east-1
  MP_ECR_ACCOUNT: '709825985650'                      # AWS Marketplace-managed ECR account
  MP_ECR_REPO: bsv-blockchain/wab                     # existing Marketplace repo for this product
  PRODUCT_ID: prod-67ziqtkrihz34                      # WAB ContainerProduct
  WAB_DIR: infra/wab

jobs:
  publish:
    name: Publish WAB to Marketplace
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write          # OIDC: assume the seller-account publisher role (no static keys)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Verify trusted release source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual Marketplace releases must run from main."
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Marketplace release tags must point to a commit reachable from main."
            exit 1
          fi

      - name: Require WAB_MP_ROLE_ARN
        run: |
          if [ -z "${{ vars.WAB_MP_ROLE_ARN }}" ]; then
            echo "::error::Repository variable WAB_MP_ROLE_ARN is not set. Create the seller-account OIDC role and set the var before running this workflow."
            exit 1
          fi

      - name: Resolve version from package.json
        id: ver
        run: |
          # The version name is ALWAYS package.json; the git tag is only the trigger (keep decoupled).
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION="$(node -p "require('./${WAB_DIR}/package.json').version")"
          fi
          [ -n "$VERSION" ] || { echo "No version found"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved WAB version: $VERSION (Marketplace title: v$VERSION)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.WAB_MP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fail closed: if we cannot prove the title list, do not publish again.
      # Immutable Marketplace version titles must not be re-submitted on API/parse errors.
      - name: Skip if this version is already published
        id: exists
        run: |
          set -euo pipefail
          TITLE="${{ steps.ver.outputs.title }}"
          # Use DetailsDocument (clean JSON). The legacy `Details` field returns non-strict JSON
          # (raw newlines in release notes) which breaks jq.
          DOC="$(aws marketplace-catalog describe-entity \
            --catalog AWSMarketplace \
            --entity-id "${PRODUCT_ID}" \
            --query DetailsDocument --output json)"
          TITLES="$(echo "$DOC" | jq -r '
            (if type == "string" then fromjson else . end)
            | .Versions as $v
            | if $v == null then error("DetailsDocument.Versions missing") else $v end
            | .[]?
            | .VersionTitle // empty
          ')"
          if echo "$TITLES" | grep -qx "$TITLE"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Version $TITLE already exists on the listing — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Version $TITLE not present — will build, push, and register."
          fi

      # Release inputs are immutable. If the committed lockfile does not match
      # package.json, the Dockerfile's npm ci fails instead of resolving a
      # different dependency graph during publication.
      - name: Resolve reproducible source metadata
        if: steps.exists.outputs.already == 'false'
        id: source
        run: |
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to AWS Marketplace ECR
        if: steps.exists.outputs.already == 'false'
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin \
              "${MP_ECR_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build image for security gate
        if: steps.exists.outputs.already == 'false'
        id: image
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          IMAGE="${MP_ECR_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${MP_ECR_REPO}:${VERSION}"
          docker build \
            --platform linux/amd64 \
            --build-arg "APP_COMMIT=${GITHUB_SHA}" \
            --build-arg "APP_VERSION=${VERSION}" \
            --build-arg "SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}" \
            --label "org.opencontainers.image.created=${{ steps.source.outputs.created }}" \
            --label "org.opencontainers.image.title=Wallet Authentication Backend" \
            --label "org.opencontainers.image.description=Multi-factor authentication backend for BSV wallets" \
            --label "org.opencontainers.image.vendor=BSV Blockchain" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=LicenseRef-Open-BSV-License-4" \
            --label "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main/infra/wab" \
            --label "org.opencontainers.image.documentation=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main/infra/wab" \
            --tag "$IMAGE" \
            "${WAB_DIR}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Reject high and critical image vulnerabilities
        if: steps.exists.outputs.already == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 15m

      - name: Generate SPDX image SBOM
        if: steps.exists.outputs.already == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: ${{ runner.temp }}/wab-${{ steps.ver.outputs.version }}.spdx.json
          artifact-name: sbom-wab-marketplace-${{ steps.ver.outputs.version }}
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Push image to Marketplace ECR
        if: steps.exists.outputs.already == 'false'
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker push "$IMAGE"
          digest="$(aws ecr describe-images \
            --registry-id "$MP_ECR_ACCOUNT" \
            --repository-name "$MP_ECR_REPO" \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No valid Marketplace ECR digest returned after push."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest"

      # AWS Marketplace controls the destination ECR repository and may not
      # permit auxiliary Cosign manifests. Store keyless provenance and SBOM
      # attestations in GitHub's attestation service against the exact ECR
      # digest instead.
      - name: Attest Marketplace build provenance
        if: steps.exists.outputs.already == 'false'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.MP_ECR_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.MP_ECR_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Attest Marketplace SPDX SBOM
        if: steps.exists.outputs.already == 'false'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.MP_ECR_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.MP_ECR_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/wab-${{ steps.ver.outputs.version }}.spdx.json

      - name: Verify Marketplace provenance and SBOM attestations
        if: steps.exists.outputs.already == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image_name="${IMAGE%:*}"
          image_ref="$image_name@$DIGEST"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wab-marketplace-release.yml" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wab-marketplace-release.yml" \
            --source-ref "$GITHUB_REF" \
            --predicate-type 'https://spdx.dev/Document/v2.3' \
            --deny-self-hosted-runners

      - name: Record Marketplace release evidence
        if: steps.exists.outputs.already == 'false'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Trivy: no high/critical findings"
            echo "- SPDX SBOM artifact uploaded"
            echo "- SLSA provenance and SBOM attestations published to GitHub"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register new version on the listing (AddDeliveryOptions)
        if: steps.exists.outputs.already == 'false'
        id: changeset
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TITLE="${{ steps.ver.outputs.title }}"
          IMAGE="${MP_ECR_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${MP_ECR_REPO}:${VERSION}"

          # DeliveryOptionTitle and CompatibleServices match the live listing (verified via
          # describe-entity). The Catalog API expects the "Anywhere" services as hyphenated
          # tokens: ECS-Anywhere / EKS-Anywhere. Uses DetailsDocument (not legacy Details).
          CHANGE_SET=$(jq -nc --arg id "$PRODUCT_ID" --arg t "$TITLE" --arg img "$IMAGE" '
            [{
              ChangeType: "AddDeliveryOptions",
              Entity: { Identifier: $id, Type: "ContainerProduct@1.0" },
              DetailsDocument: {
                Version: {
                  VersionTitle: $t,
                  ReleaseNotes: ("WAB \($t). See https://github.com/bsv-blockchain/ts-stack/tree/main/infra/wab")
                },
                DeliveryOptions: [{
                  DeliveryOptionTitle: "WAB Container - ECS/EKS Deployment",
                  Details: {
                    EcrDeliveryOptionDetails: {
                      ContainerImages: [ $img ],
                      CompatibleServices: [ "ECS", "EKS", "ECS-Anywhere", "EKS-Anywhere" ],
                      Description: "Wallet Authentication Backend",
                      UsageInstructions: "See https://github.com/bsv-blockchain/ts-stack/tree/main/infra/wab"
                    }
                  }
                }]
              }
            }]')

          CS_ID=$(aws marketplace-catalog start-change-set \
            --catalog AWSMarketplace \
            --change-set "$CHANGE_SET" \
            --query 'ChangeSetId' --output text)
          echo "change_set_id=$CS_ID" >> "$GITHUB_OUTPUT"
          echo "Started change set $CS_ID for $TITLE"

      - name: Wait for change set to settle (scan can take minutes–hours)
        if: steps.exists.outputs.already == 'false'
        run: |
          set -euo pipefail
          CS_ID="${{ steps.changeset.outputs.change_set_id }}"
          [ -n "$CS_ID" ] || { echo "No change_set_id from previous step"; exit 1; }
          for i in $(seq 1 60); do
            STATUS=$(aws marketplace-catalog describe-change-set \
              --catalog AWSMarketplace --change-set-id "$CS_ID" \
              --query 'Status' --output text)
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              SUCCEEDED) echo "Version published."; exit 0 ;;
              FAILED|CANCELLED)
                echo "Change set $STATUS. Error details:"
                aws marketplace-catalog describe-change-set --catalog AWSMarketplace \
                  --change-set-id "$CS_ID" --query 'ChangeSet[].ErrorDetailList'
                exit 1 ;;
              None|null|"")
                echo "Empty/unknown change-set status; failing closed."
                exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::Still PREPARING/APPLYING after ~60m; listing is not confirmed live."
          echo "Check the Requests log in the AWS Marketplace portal."
          echo "Change set: $CS_ID"
          exit 1
