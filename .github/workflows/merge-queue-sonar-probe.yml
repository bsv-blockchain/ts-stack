name: Isolated Sonar queue probe

on:
  pull_request:
    branches: [codex/merge-queue-sonar-canary-20261120-r2]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  probe:
    name: Queue probe execution
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'codex/merge-queue-sonar-canary-20261120-r2') ||
      (github.event_name == 'merge_group' &&
       github.event.merge_group.base_ref == 'refs/heads/codex/merge-queue-sonar-canary-20261120-r2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact event revision
        env:
          EXPECTED_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare isolated scan configuration
        if: github.event_name == 'merge_group'
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          cp .sonarcloud.properties "$RUNNER_TEMP/queue-sonar.properties"
          cat >> "$RUNNER_TEMP/queue-sonar.properties" <<EOF_CONFIG
          sonar.organization=bsv
          sonar.projectKey=bsv-blockchain_ts-stack
          sonar.host.url=https://sonarcloud.io
          sonar.sources=.
          sonar.sourceEncoding=UTF-8
          sonar.branch.name=merge-queue-$QUEUE_SHA
          sonar.branch.target=main
          sonar.scm.revision=$QUEUE_SHA
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=600
          EOF_CONFIG
      - name: Analyze the exact combined tree
        if: github.event_name == 'merge_group'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dproject.settings=${{ runner.temp }}/queue-sonar.properties
      - name: Enforce exact queue zero-findings gate
        if: github.event_name == 'merge_group'
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/sonar-queue-gate.mjs "$QUEUE_SHA"
      - name: Record trial identity
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          printf 'Event: %s\nExact revision: %s\n' "$EVENT_NAME" "$EVENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Vendor reporting probe only; this does not qualify main admission.\n' >> "$GITHUB_STEP_SUMMARY"
