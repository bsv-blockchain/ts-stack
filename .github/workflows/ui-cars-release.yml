name: UI CARS release

on:
  workflow_dispatch:
    inputs:
      project:
        description: UI application
        type: choice
        options: [uhrp-ui, wui]
        required: true
      target:
        description: CARS configuration index
        type: choice
        options: ['1']
        default: '1'
      publish:
        description: Request release approval after staging the artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-cars-${{ inputs.project }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  UI_PROJECT: ${{ inputs.project }}
  CARS_TARGET: ${{ inputs.target }}

jobs:
  stage:
    name: Build CARS candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Build from workspace lock and assemble frontend
        id: archive
        run: |
          set -euo pipefail
          case "$UI_PROJECT" in uhrp-ui|wui) ;; *) exit 1 ;; esac
          test "$CARS_TARGET" = 1
          project="packages/ui/$UI_PROJECT"
          jq -e '
            .frontend.language == "react" and
            .frontend.sourceDirectory == "./frontend" and
            .configs[1].deploy == ["frontend"] and
            (.configs[1].projectID | type == "string" and length > 0) and
            (.configs[1].CARSCloudURL | type == "string" and startswith("https://"))
          ' "$project/deployment-info.json" > /dev/null
          pnpm --filter "{./$project/frontend}..." run build
          (cd "$project/frontend" && node ../../../../scripts/check-ui-build.mjs build)
          stage="$(mktemp -d "$RUNNER_TEMP/cars-stage.XXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          cp "$project/deployment-info.json" "$project/package.json" "$stage/"
          cp -R "$project/frontend/build" "$stage/frontend"
          mkdir "$RUNNER_TEMP/cars-candidate"
          tar -czf "$RUNNER_TEMP/cars-candidate/cars_artifact_1.tgz" -C "$stage" .
          cd "$RUNNER_TEMP/cars-candidate"
          checksum="$(sha256sum cars_artifact_1.tgz)"
          printf '%s\n' "$checksum" > SHA256SUMS
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: cars-${{ inputs.project }}-${{ inputs.target }}
          path: ${{ runner.temp }}/cars-candidate
          if-no-files-found: error

  release:
    name: Release the staged CARS artifact
    needs: stage
    if: github.ref == 'refs/heads/main' && inputs.publish
    environment: release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARS_ARTIFACT_ID: ${{ needs.stage.outputs.artifact_id }}
      CARS_ARCHIVE_SHA256: ${{ needs.stage.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the staged artifact identity
        run: |
          set -euo pipefail
          [[ "$CARS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CARS_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.stage.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/cars-candidate
      - name: Verify and release UHRP UI
        if: inputs.project == 'uhrp-ui' && inputs.target == '1'
        env:
          CARS_PRIVATE_KEY: ${{ secrets.CARS_UHRP_UI_1_PRIVATE_KEY }}
        run: bash scripts/ui-cars-release.sh
      - name: Verify and release WUI
        if: inputs.project == 'wui' && inputs.target == '1'
        env:
          CARS_PRIVATE_KEY: ${{ secrets.CARS_WUI_1_PRIVATE_KEY }}
        run: bash scripts/ui-cars-release.sh
