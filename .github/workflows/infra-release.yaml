name: Infra Release

# Builds a Docker image for every component in ./infra whose
# package.json version is not yet published to GHCR, and pushes
# the image as ghcr.io/<owner>/<component>:v<version>.
#
# Trigger: push of an `infra/v*` tag (the version embedded in the tag
# is informational only — each component is released based on its
# own package.json version vs what already exists in GHCR).
on:
  push:
    tags:
      - 'infra/v*'
  workflow_dispatch:

jobs:
  discover:
    name: Discover infra components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR (for manifest probes)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Walk every ./infra/<name> dir. Skip dirs without a Dockerfile or
      # without a package.json version. For each surviving component,
      # check whether ghcr.io/<owner>/<name>:v<version> already exists —
      # if it does, drop the component from the matrix so we don't
      # rebuild already-released versions.
      - name: Build release matrix
        id: set
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          components='[]'
          for d in infra/*/; do
            name="$(basename "$d")"
            [ -f "$d/Dockerfile" ] || { echo "skip $name: no Dockerfile"; continue; }
            [ -f "$d/package.json" ] || { echo "skip $name: no package.json"; continue; }
            version="$(node -p "require('./$d/package.json').version || ''")"
            if [ -z "$version" ]; then
              echo "skip $name: no version in package.json"
              continue
            fi
            image="ghcr.io/$owner/$name"
            tag="v$version"
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "skip $name@$tag: already published to $image:$tag"
              continue
            fi
            echo "queue $name@$tag -> $image:$tag"
            components="$(jq -c --arg name "$name" --arg version "$version" --arg image "$image" --arg tag "$tag" \
              '. + [{name:$name,version:$version,image:$image,tag:$tag}]' <<<"$components")"
          done
          count="$(jq 'length' <<<"$components")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$components" >> "$GITHUB_OUTPUT"
          echo "Resolved $count component(s) to release:"
          jq -r '.[] | "  - \(.name)@\(.tag)"' <<<"$components"

  release:
    name: Release ${{ matrix.component.name }}@${{ matrix.component.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Refresh this component's package-lock.json before building. Infra
      # components are NOT in the pnpm workspace; their npm lockfiles go stale
      # whenever a consumed @bsv/* library publishes a new version — the
      # package.json range still resolves, but the locked version lags. The
      # Dockerfile runs `npm ci`, which hard-fails on a stale lock; that is what
      # broke uhrp-server-basic@v0.1.6 in run 28217110637. Regenerating the lock
      # here (peer-aware, no node_modules I/O) lets the build pull the current
      # published library versions. The refreshed lock is persisted back to main
      # by the sync-lockfiles job below.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Refresh package-lock.json
        working-directory: infra/${{ matrix.component.name }}
        run: npm install --package-lock-only --ignore-scripts

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component.image }}:${{ matrix.component.tag }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: infra/${{ matrix.component.name }}
          file: infra/${{ matrix.component.name }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ matrix.component.image }}:${{ matrix.component.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.component.version }}
            org.opencontainers.image.title=${{ matrix.component.name }}

  # The release job refreshes each built component's lockfile on its own
  # ephemeral runner, so main's committed lockfiles still lag the library
  # versions the images were built against. Re-run the refresh once on a clean
  # main checkout and open a PR so the repo's committed locks catch up — without
  # this, the next infra/v* release would rebuild from a lock the repo still
  # records as stale. Runs even if a component build failed (always()): syncing
  # the locks is independent of, and de-risks, the next release.
  sync-lockfiles:
    name: Sync infra lockfiles to main
    needs: [discover, release]
    if: ${{ always() && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      # Peer-aware (no --legacy-peer-deps): @bsv/* libraries declare @bsv/sdk as
      # a peerDependency that the lock must record, or a later `npm ci` fails
      # with "Missing: @bsv/sdk from lock file".
      - name: Refresh all infra lockfiles
        run: |
          for d in infra/*/; do
            [ -f "$d/package.json" ] || continue
            [ -f "$d/package-lock.json" ] || continue
            echo "Refreshing lockfile in $d"
            (cd "$d" && npm install --package-lock-only --ignore-scripts)
          done

      - name: Open lockfile sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/infra-lockfile-sync
        run: |
          if git diff --quiet -- 'infra/**/package-lock.json'; then
            echo "No infra lockfile changes; nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$SYNC_BRANCH"
          git add 'infra/**/package-lock.json'
          git commit -m "chore(infra): sync lockfiles to published library versions"
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

          existing_pr="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          body="Refreshes infra/*/package-lock.json to the library versions resolved during the latest infra/v* release. Opened automatically by the Infra Release workflow."
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "chore(infra): sync lockfiles to published library versions" \
              --body "$body"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(infra): sync lockfiles to published library versions" \
              --body "$body"
          fi
