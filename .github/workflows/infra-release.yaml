name: Infra Release

# Primary general image release for all infra/* components.
# Builds a Docker image for every component in ./infra whose
# package.json version is not yet published to GHCR, and pushes
# the image as ghcr.io/<owner>/<component>:v<version>.
#
# This is the normal OCI path for self-hosters and third-party systems.
# WAB additionally publishes to AWS Marketplace via
# wab-marketplace-release.yml on the same tag — that path is additive
# and does not replace this workflow.
#
# Trigger: push of an `infra/v*` tag (the version embedded in the tag
# is informational only — each component is released based on its
# own package.json version vs what already exists in GHCR).
on:
  push:
    tags:
      - 'infra/v*'
  workflow_dispatch:

jobs:
  discover:
    name: Discover infra components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR (for manifest probes)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Walk every ./infra/<name> dir. Skip dirs without a Dockerfile or
      # without a package.json version. For each surviving component,
      # check whether ghcr.io/<owner>/<name>:v<version> already exists —
      # if it does, drop the component from the matrix so we don't
      # rebuild already-released versions.
      - name: Build release matrix
        id: set
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          components='[]'
          for d in infra/*/; do
            name="$(basename "$d")"
            [ -f "$d/Dockerfile" ] || { echo "skip $name: no Dockerfile"; continue; }
            [ -f "$d/package.json" ] || { echo "skip $name: no package.json"; continue; }
            version="$(node -p "require('./$d/package.json').version || ''")"
            if [ -z "$version" ]; then
              echo "skip $name: no version in package.json"
              continue
            fi
            image="ghcr.io/$owner/$name"
            tag="v$version"
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "skip $name@$tag: already published to $image:$tag"
              continue
            fi
            echo "queue $name@$tag -> $image:$tag"
            components="$(jq -c --arg name "$name" --arg version "$version" --arg image "$image" --arg tag "$tag" \
              '. + [{name:$name,version:$version,image:$image,tag:$tag}]' <<<"$components")"
          done
          count="$(jq 'length' <<<"$components")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$components" >> "$GITHUB_OUTPUT"
          echo "Resolved $count component(s) to release:"
          jq -r '.[] | "  - \(.name)@\(.tag)"' <<<"$components"

  release:
    name: Release ${{ matrix.component.name }}@${{ matrix.component.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component.image }}:${{ matrix.component.tag }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: infra/${{ matrix.component.name }}
          file: infra/${{ matrix.component.name }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ matrix.component.image }}:${{ matrix.component.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.component.version }}
            org.opencontainers.image.title=${{ matrix.component.name }}
