name: Infra Release

# Primary general image release for all infra/* components.
# Builds a Docker image for every component in ./infra whose
# package.json version is not yet published to GHCR, and pushes
# the image as ghcr.io/<owner>/<component>:v<version>.
#
# This is the normal OCI path for self-hosters and third-party systems.
# WAB additionally publishes to AWS Marketplace via
# wab-marketplace-release.yml on the same tag — that path is additive
# and does not replace this workflow.
#
# Trigger: push of an `infra/v*` tag (the version embedded in the tag
# is informational only — each component is released based on its
# own package.json version vs what already exists in GHCR).
on:
  push:
    tags:
      - 'infra/v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: infra-release
  cancel-in-progress: false

jobs:
  discover:
    name: Discover infra components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      all-matrix: ${{ steps.set.outputs.all-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify trusted release source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual infrastructure releases must run from main."
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Infrastructure release tags must point to a commit reachable from main."
            exit 1
          fi

      - name: Log in to GHCR (for manifest probes)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve every registered container component. The registry is checked
      # by repository controls against the Dockerfiles so neither an image nor
      # its title/license/documentation metadata can silently fall out of the
      # release matrix.
      - name: Build release matrix
        id: set
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          components='[]'
          all_components='[]'
          while IFS= read -r component; do
            name="$(jq -r '.name' <<<"$component")"
            path="$(jq -r '.path' <<<"$component")"
            version="$(node -p "require('./$path/package.json').version || ''")"
            if [ -z "$version" ]; then
              echo "::error::$path/package.json has no version."
              exit 1
            fi
            image="ghcr.io/$owner/$name"
            tag="v$version"
            resolved="$(jq -c \
              --argjson component "$component" \
              --arg version "$version" \
              --arg image "$image" \
              --arg tag "$tag" \
              '$component + {version:$version,image:$image,tag:$tag}' \
              <<<"{}")"
            all_components="$(jq -c \
              --argjson component "$resolved" \
              '. + [$component]' \
              <<<"$all_components")"
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "skip $name@$tag: already published to $image:$tag"
              continue
            fi
            echo "queue $name@$tag -> $image:$tag"
            components="$(jq -c \
              --argjson component "$resolved" \
              '. + [$component]' \
              <<<"$components")"
          done < <(jq -c '.components[]' governance/container-images.json)
          count="$(jq 'length' <<<"$components")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$components" >> "$GITHUB_OUTPUT"
          echo "all-matrix=$all_components" >> "$GITHUB_OUTPUT"
          echo "Resolved $count component(s) to release:"
          jq -r '.[] | "  - \(.name)@\(.tag)"' <<<"$components"

  release:
    name: Release ${{ matrix.component.name }}@${{ matrix.component.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve reproducible source metadata
        id: source
        run: |
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.component.image }}
          tags: |
            type=raw,value=${{ matrix.component.tag }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.title=${{ matrix.component.title }}
            org.opencontainers.image.description=${{ matrix.component.description }}
            org.opencontainers.image.vendor=BSV Blockchain
            org.opencontainers.image.version=${{ matrix.component.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ matrix.component.license }}
            org.opencontainers.image.url=${{ matrix.component.documentation }}
            org.opencontainers.image.documentation=${{ matrix.component.documentation }}

      # Build once into the local daemon. Every subsequent gate and publication
      # step operates on this exact image instead of rebuilding after review.
      - name: Build release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.component.path }}
          file: ${{ matrix.component.path }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_VERSION=${{ matrix.component.version }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
          cache-from: type=gha,scope=infra-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=infra-${{ matrix.component.name }}

      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.component.image }}:${{ matrix.component.tag }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 15m

      - name: Generate SPDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.component.image }}:${{ matrix.component.tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.component.name }}-${{ matrix.component.version }}.spdx.json
          artifact-name: sbom-${{ matrix.component.name }}-${{ matrix.component.version }}
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Push the reviewed image
        id: push
        env:
          IMAGE: ${{ matrix.component.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION_TAG: ${{ matrix.component.tag }}
        run: |
          version_ref="$IMAGE:$VERSION_TAG"
          push_output="$(docker push "$version_ref" 2>&1)"
          printf '%s\n' "$push_output"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$push_output" | tail -1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the pushed digest for $version_ref."
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$version_ref" ] && continue
            tag_output="$(docker push "$tag" 2>&1)"
            printf '%s\n' "$tag_output"
            tag_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$tag_output" | tail -1)"
            if [ "$tag_digest" != "$digest" ]; then
              echo "::error::$tag resolved to $tag_digest instead of $digest."
              exit 1
            fi
          done <<<"$TAGS"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.component.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.component.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.component.name }}-${{ matrix.component.version }}.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image and attest the reviewed SBOM
        env:
          IMAGE: ${{ matrix.component.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ runner.temp }}/${{ matrix.component.name }}-${{ matrix.component.version }}.spdx.json
        run: |
          image_ref="$IMAGE@$DIGEST"
          cosign sign --yes "$image_ref"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$image_ref"

  # Verify every governed version tag after the release matrix settles. This
  # also runs when every image was already published, so failed verification
  # can be repaired and rerun without rebuilding or mutating immutable tags.
  verify-published:
    name: Verify published ${{ matrix.component.name }}@${{ matrix.component.tag }}
    needs:
      - discover
      - release
    if: ${{ always() && needs.discover.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.all-matrix) }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published digest
        id: published
        env:
          IMAGE: ${{ matrix.component.image }}
          EXPECTED_VERSION: ${{ matrix.component.version }}
          VERSION_TAG: ${{ matrix.component.tag }}
        run: |
          version_ref="$IMAGE:$VERSION_TAG"
          inspect_output="$(docker buildx imagetools inspect "$version_ref")"
          printf '%s\n' "$inspect_output"
          digest="$(sed -nE \
            's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' \
            <<<"$inspect_output" | head -1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the published digest for $version_ref."
            exit 1
          fi
          image_json="$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}')"
          platform="$(jq -r '.os + "/" + .architecture' <<<"$image_json")"
          source_sha="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' <<<"$image_json")"
          published_version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // ""' <<<"$image_json")"
          if [ "$platform" != "linux/amd64" ]; then
            echo "::error::$version_ref has platform $platform instead of linux/amd64."
            exit 1
          fi
          if [ "$published_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::$version_ref carries version $published_version instead of $EXPECTED_VERSION."
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$version_ref has invalid source revision $source_sha."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify digest, signature, provenance, and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.component.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          image_ref="$IMAGE@$DIGEST"
          identity='^https://github\.com/bsv-blockchain/ts-stack/\.github/workflows/infra-release\.yaml@refs/(tags/infra/v.+|heads/main)$'
          issuer='https://token.actions.githubusercontent.com'
          docker buildx imagetools inspect "$image_ref"
          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image_ref" >/dev/null
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image_ref" >/dev/null
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/infra-release.yaml" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/infra-release.yaml" \
            --source-ref "$GITHUB_REF" \
            --predicate-type 'https://spdx.dev/Document/v2.3' \
            --deny-self-hosted-runners >/dev/null

      - name: Record verified publication evidence
        env:
          IMAGE: ${{ matrix.component.image }}
          VERSION_TAG: ${{ matrix.component.tag }}
          DIGEST: ${{ steps.published.outputs.digest }}
          PLATFORM: ${{ steps.published.outputs.platform }}
          SOURCE_SHA: ${{ steps.published.outputs.source-sha }}
        run: |
          {
            echo "### $IMAGE:$VERSION_TAG"
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Platform: \`$PLATFORM\`"
            echo "- Trivy: no high/critical findings"
            echo "- SPDX SBOM artifact uploaded and attested"
            echo "- SLSA provenance and SBOM attestations published to GitHub and GHCR"
            echo "- Image digest keylessly signed with GitHub OIDC via Cosign"
          } >> "$GITHUB_STEP_SUMMARY"

  post-release-verification:
    needs:
      - release
      - verify-published
    if: ${{ always() && needs.verify-published.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/dependency-release-verification.yml
