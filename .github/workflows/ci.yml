name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release acceptance must be able to exercise the complete current tree.
  workflow_dispatch:
    inputs:
      mutation-diagnostics:
        description: Collect mutation diagnostics despite analyzer failure; never bypass qualification
        type: boolean
        default: false
        required: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Repository health contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Test repository health controls
        run: node --test scripts/*.test.mjs

      - name: Enforce uniform contributor and agent policy
        run: node scripts/contributor-policy.mjs

      - name: Enforce the TypeScript compiler and tooling-API boundary
        run: node scripts/typescript-toolchain.mjs

      - name: Enforce persistent dependency and release governance
        run: node scripts/dependency-release-governance.mjs check

      - name: Report dependency review evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.actor }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: >-
          node scripts/dependency-release-governance.mjs pr-evidence
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Enforce test, manual-suite, and conformance skip governance
        run: node scripts/test-governance.mjs

      - name: Verify synchronized service security policies
        run: |
          node scripts/sync-service-rate-limit-policy.mjs --check
          node scripts/sync-service-edge-policy.mjs --check
          node scripts/sync-service-runtime-copies.mjs --check

      - name: Enforce inventory, exception, baseline, and contract ratchets
        run: >-
          node scripts/repository-health.mjs
          --format text
          --summary-file "$GITHUB_STEP_SUMMARY"

  scope:
    name: Select affected work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      direct-projects: ${{ steps.scope.outputs.direct-projects }}
      affected-projects: ${{ steps.scope.outputs.affected-projects }}
      build-projects: ${{ steps.scope.outputs.build-projects }}
      mutation-targets: ${{ steps.scope.outputs.mutation-targets }}
      mutation-classification: ${{ steps.scope.outputs.mutation-classification }}
      mutation-matrix: ${{ steps.scope.outputs.mutation-matrix }}
      partition-targets: ${{ steps.scope.outputs.partition-targets }}
      infra-matrix: ${{ steps.scope.outputs.infra-matrix }}
      has-infra: ${{ steps.scope.outputs.has-infra }}
      docs: ${{ steps.scope.outputs.docs }}
      conformance: ${{ steps.scope.outputs.conformance }}
      standard-packages: ${{ steps.lanes.outputs.standard-packages }}
      dependent-test-packages: ${{ steps.lanes.outputs.dependent-test-packages }}
      dependent-test-matrix: ${{ steps.lanes.outputs.dependent-test-matrix }}
      coverage-other-packages: ${{ steps.lanes.outputs.coverage-other-packages }}
      coverage-other-matrix: ${{ steps.lanes.outputs.coverage-other-matrix }}
      browser-packages: ${{ steps.lanes.outputs.browser-packages }}
      browser-matrix: ${{ steps.lanes.outputs.browser-matrix }}
      pack-matrix: ${{ steps.lanes.outputs.pack-matrix }}
      coverage-required: ${{ steps.lanes.outputs.coverage-required }}
      sdk: ${{ steps.lanes.outputs.sdk }}
      did: ${{ steps.lanes.outputs.did }}
      wallet: ${{ steps.lanes.outputs.wallet }}
      wallet_client: ${{ steps.lanes.outputs.wallet_client }}
      wallet_mobile: ${{ steps.lanes.outputs.wallet_mobile }}
      verifast: ${{ steps.lanes.outputs.verifast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Resolve package, mutation, documentation, conformance, and image scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE_SHA="$PR_BASE_SHA"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$PUSH_BASE_SHA"; fi
          if [ -n "$BASE_SHA" ] &&
             [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            SCOPE=$(node scripts/ci-affected-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA")
            # Mutation is a full-suite qualification: ordinary pull requests and
            # pushes select no targets. Dispatch CI, or the scheduled Mutation
            # quality workflow, to run the complete governed registry.
            MUTATION_SCOPE=$(node scripts/ci-mutation-scope.mjs --base "$BASE_SHA" --head HEAD)
          else
            SCOPE=$(node scripts/ci-affected-scope.mjs --all)
            MUTATION_SCOPE=$(node scripts/ci-mutation-scope.mjs --all)
          fi
          MUTATION_TARGETS=$(jq -c '.required' <<<"$MUTATION_SCOPE")
          if [ "$(jq -r 'type' <<<"$MUTATION_TARGETS")" != "array" ]; then
            echo "::error::Mutation classification is missing required targets"
            exit 1
          fi

          echo "direct-projects=$(jq -c '.directProjects' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "affected-projects=$(jq -c '.affectedProjects' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "build-projects=$(jq -c '.buildProjects' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "infra-matrix=$(jq -c '.infraMatrix' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "docs=$(jq -r '.docs' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "conformance=$(jq -r '.conformance' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"
          echo "mutation-targets=$MUTATION_TARGETS" >> "$GITHUB_OUTPUT"
          echo "mutation-classification=$MUTATION_SCOPE" >> "$GITHUB_OUTPUT"
          MUTATION_MATRIX=$(node scripts/mutation-partition-evidence.mjs matrix --selected "$MUTATION_TARGETS")
          PARTITION_TARGETS=$(node scripts/mutation-partition-evidence.mjs targets --selected "$MUTATION_TARGETS")
          echo "mutation-matrix=$MUTATION_MATRIX" >> "$GITHUB_OUTPUT"
          echo "partition-targets=$PARTITION_TARGETS" >> "$GITHUB_OUTPUT"
          echo "has-infra=$(jq -r '.infraMatrix.include | length > 0' <<<"$SCOPE")" >> "$GITHUB_OUTPUT"

          {
            echo '### Affected scope'
            echo
            echo "- Direct test packages: $(jq -c '[.directProjects[].name]' <<<"$SCOPE")"
            echo "- Compatibility packages: $(jq -c '[.affectedProjects[].name]' <<<"$SCOPE")"
            echo "- Mutation targets in this run (full campaigns only): $MUTATION_TARGETS"
            echo "- Deferred to the scheduled or dispatched full campaign (not passed): $(jq -c '.deferred' <<<"$MUTATION_SCOPE")"
            echo "- Critical targets awaiting the full campaign (not passed): $(jq -c '.outside' <<<"$MUTATION_SCOPE")"
            echo "- Infrastructure: $(jq -c '[.infraMatrix.include[].display]' <<<"$SCOPE")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan test lanes
        # Coverage suites run only for directly changed package importers.
        # Regression/type compatibility expands through dependents; builds also
        # include their prerequisites. Planning needs only Node and jq, so it
        # runs here instead of behind the install and build.
        id: lanes
        env:
          DIRECT_PROJECTS: ${{ steps.scope.outputs.direct-projects }}
          AFFECTED_PROJECTS: ${{ steps.scope.outputs.affected-projects }}
        run: |
          DIRECT=$(jq -r '.[].name' <<<"$DIRECT_PROJECTS")
          AFFECTED=$(jq -r '.[].name' <<<"$AFFECTED_PROJECTS")
          printf '%s\n' "$DIRECT_PROJECTS" > .ci-direct-packages.json
          printf '%s\n' "$AFFECTED_PROJECTS" > .ci-affected-packages.json
          DEPENDENT_PROJECTS=$(jq -n -c \
            --argjson affected "$AFFECTED_PROJECTS" \
            --argjson direct "$DIRECT_PROJECTS" \
            '$direct | map(.name) as $directNames | $affected | map(select(.name as $name | ($directNames | index($name) | not)))')
          printf '%s\n' "$DEPENDENT_PROJECTS" > .ci-dependent-packages.json

          DEPENDENT_TEST_PACKAGES=$(node scripts/run-ci-tests.mjs \
            --projects-json .ci-dependent-packages.json \
            --mode test)
          echo "dependent-test-packages=$DEPENDENT_TEST_PACKAGES" >> "$GITHUB_OUTPUT"
          DEPENDENT_TEST_MATRIX=$(node scripts/ci-shard-plan.mjs \
            --packages-json "$DEPENDENT_TEST_PACKAGES" \
            --durations governance/ci-lane-durations.json \
            --lane dependent-tests)
          echo "dependent-test-matrix=$DEPENDENT_TEST_MATRIX" >> "$GITHUB_OUTPUT"

          STANDARD_PACKAGES=$(node scripts/run-ci-tests.mjs \
            --projects-json .ci-direct-packages.json)
          echo "standard-packages=$STANDARD_PACKAGES" >> "$GITHUB_OUTPUT"
          COVERAGE_OTHER_PACKAGES=$(node scripts/run-ci-tests.mjs \
            --projects-json .ci-direct-packages.json \
            --mode coverage-other)
          echo "coverage-other-packages=$COVERAGE_OTHER_PACKAGES" >> "$GITHUB_OUTPUT"
          # Packages run serially inside a shard, so plan shards from measured
          # durations rather than package count.
          COVERAGE_OTHER_MATRIX=$(node scripts/ci-shard-plan.mjs \
            --packages-json "$COVERAGE_OTHER_PACKAGES" \
            --durations governance/ci-lane-durations.json \
            --lane coverage-other)
          echo "coverage-other-matrix=$COVERAGE_OTHER_MATRIX" >> "$GITHUB_OUTPUT"
          BROWSER_PACKAGES=$(node scripts/run-ci-tests.mjs \
            --projects-json .ci-affected-packages.json \
            --mode browser)
          echo "browser-packages=$BROWSER_PACKAGES" >> "$GITHUB_OUTPUT"
          BROWSER_MATRIX=$(jq -c \
            'if length > 1 then {include:[{shard:1,total:2},{shard:2,total:2}]} else {include:[{shard:1,total:1}]} end' \
            <<<"$BROWSER_PACKAGES")
          echo "browser-matrix=$BROWSER_MATRIX" >> "$GITHUB_OUTPUT"
          PACK_PACKAGES=$(node scripts/run-ci-tests.mjs \
            --projects-json .ci-direct-packages.json \
            --mode pack)
          PACK_MATRIX=$(node scripts/ci-shard-plan.mjs \
            --packages-json "$PACK_PACKAGES" \
            --durations governance/ci-lane-durations.json \
            --lane package-artifacts)
          echo "pack-matrix=$PACK_MATRIX" >> "$GITHUB_OUTPUT"

          COVERAGE_REQUIRED=false
          if [ "$COVERAGE_OTHER_PACKAGES" != "[]" ] ||
             grep -Eq '^(@bsv/did|@bsv/sdk|@bsv/verifast|@bsv/wallet-toolbox)$' <<<"$DIRECT"; then
            COVERAGE_REQUIRED=true
          fi
          echo "coverage-required=$COVERAGE_REQUIRED" >> "$GITHUB_OUTPUT"

          for entry in \
            "sdk:@bsv/sdk" \
            "did:@bsv/did" \
            "wallet:@bsv/wallet-toolbox" \
            "verifast:@bsv/verifast"; do
            key="${entry%%:*}"
            package="${entry#*:}"
            if grep -Fxq "$package" <<<"$DIRECT"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

          for entry in \
            "wallet_client:@bsv/wallet-toolbox-client" \
            "wallet_mobile:@bsv/wallet-toolbox-mobile"; do
            key="${entry%%:*}"
            package="${entry#*:}"
            if grep -Fxq "$package" <<<"$AFFECTED"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

  sonar-zero-findings:
    name: Quality gate — zero new Sonar findings
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Require the exact Sonar analysis to contain no new findings
        run: >-
          node scripts/sonar-pr-gate.mjs
          --project bsv-blockchain_ts-stack
          --pull-request "${{ github.event.pull_request.number }}"
          --revision "${{ github.event.pull_request.head.sha }}"

  early-gates:
    name: Early policy gates
    if: always()
    needs:
      - repository-health
      - scope
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Stop before installing or building when a cheap gate failed
        env:
          HEALTH_RESULT: ${{ needs.repository-health.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          if [[ "$HEALTH_RESULT" != "success" ||
                "$SCOPE_RESULT" != "success" ||
                ( "$DEPENDENCY_RESULT" != "success" && "$DEPENDENCY_RESULT" != "skipped" ) ]]; then
            echo "::error::Early policy gate failed: health=$HEALTH_RESULT scope=$SCOPE_RESULT dependency=$DEPENDENCY_RESULT"
            exit 1
          fi

  build:
    name: Build workspace
    # The build starts immediately, beside the scope job and the
    # repository-health contract; test lanes still start only after every
    # early gate has passed. It builds every workspace package, restoring the
    # unchanged ones from the package build cache.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24.22.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pin: package-release-artifacts dry-run enforces
          # governance/npm-package-supply-chain.json buildRuntime.node.
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild the audited workspace build tool
        run: pnpm rebuild esbuild

      - name: Restore cached package build outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-cache
          key: package-builds-${{ runner.os }}-${{ github.sha }}
          restore-keys: package-builds-${{ runner.os }}-

      - name: Build workspace
        # Packages whose own files, workspace dependencies and root toolchain
        # inputs are unchanged restore their outputs; the rest build as before.
        id: build
        run: |
          names=$(node scripts/build-output-cache.mjs names)
          plan=$(node scripts/build-output-cache.mjs restore --names-json "$names" --cache-directory .build-cache)
          echo "Restored unchanged package builds: $(jq -c '.restored' <<<"$plan")"
          filters=()
          while IFS= read -r package; do filters+=(--filter "$package"); done < <(jq -r '.build[]' <<<"$plan")
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "No package build is affected."
          else
            pnpm -r --if-present "${filters[@]}" run build
          fi
          saved=$(node scripts/build-output-cache.mjs save --names-json "$names" --cache-directory .build-cache)
          echo "cache-changed=$(jq '.saved | length > 0' <<<"$saved")" >> "$GITHUB_OUTPUT"

      - name: Save package build outputs
        if: steps.build.outputs.cache-changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-cache
          key: package-builds-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive build outputs
        run: |
          {
            find packages -type d \( -name dist -o -name out \) -prune -print0
            find packages -type f -name '*.tsbuildinfo' -print0
          } | tar --null --create --gzip --file build-outputs.tar.gz --files-from=-

      - name: Share build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-outputs
          path: build-outputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  policy:
    name: Lint and policy
    needs:
      - early-gates
      - scope
      - build
    if: >-
      always() && !cancelled() && needs.early-gates.result == 'success' &&
      needs.scope.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24.22.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pin: package-release-artifacts dry-run enforces
          # governance/npm-package-supply-chain.json buildRuntime.node.
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild the audited workspace build tool
        run: pnpm rebuild esbuild

      - name: Reject high and critical dependency advisories
        run: pnpm audit:security

      - name: Enforce the service operations contract
        run: pnpm ops:check

      - name: Check cross-package version references
        # Non-blocking. Multi-package patch PRs (one bump touches several packages whose
        # downstream deps can't reference the new versions until publish) will always
        # report stale refs in CI. Sync-versions.mjs runs at release time to reconcile.
        continue-on-error: true
        run: node scripts/check-versions.mjs

      - name: Check @bsv/sdk peer-dependency contract
        # Blocking. Published packages/** libraries must declare @bsv/sdk as a
        # peerDependency (wide range), never a regular dependency — duplicate SDK
        # copies become incompatible nominal types for downstream consumers.
        run: node scripts/check-sdk-peer.mjs

      - name: Verify installed CI qualification integration
        run: node --test scripts/ci-integration/*.test.mjs

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts

      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz

      - name: Typecheck workspace
        env:
          AFFECTED_PROJECTS: ${{ needs.scope.outputs.affected-projects }}
        run: |
          filters=()
          while IFS= read -r package; do filters+=(--filter "$package"); done < <(
            jq -r '.[].name | select(. != "docs-site" and . != "example-paymail")' <<<"$AFFECTED_PROJECTS"
          )
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "No package typecheck is affected."
          else
            pnpm -r --if-present "${filters[@]}" run typecheck
          fi

      - name: Lint all authored code with zero warnings
        run: pnpm lint

      - name: Check repository and changed-package formatting
        env:
          DIRECT_PROJECTS: ${{ needs.scope.outputs.direct-projects }}
        run: |
          pnpm format:root
          filters=()
          while IFS= read -r package; do filters+=(--filter "$package"); done < <(
            jq -r '.[].name | select(. != "docs-site" and . != "@bsv/conformance-runner" and . != "@bsv/conformance-runner-ts")' <<<"$DIRECT_PROJECTS"
          )
          if [ "${#filters[@]}" -gt 0 ]; then
            pnpm -r --if-present "${filters[@]}" run format:check
          fi

  prepare:
    name: Start test lanes
    # Test lanes fan out from here once the early gates pass and the shared
    # build exists. Lint and policy run beside them and gate the merge.
    needs:
      - early-gates
      - scope
      - build
    if: >-
      always() && !cancelled() && needs.early-gates.result == 'success' &&
      needs.scope.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      direct-projects: ${{ needs.scope.outputs.direct-projects }}
      affected-projects: ${{ needs.scope.outputs.affected-projects }}
      build-projects: ${{ needs.scope.outputs.build-projects }}
      standard-packages: ${{ needs.scope.outputs.standard-packages }}
      dependent-test-packages: ${{ needs.scope.outputs.dependent-test-packages }}
      dependent-test-matrix: ${{ needs.scope.outputs.dependent-test-matrix }}
      coverage-other-packages: ${{ needs.scope.outputs.coverage-other-packages }}
      coverage-other-matrix: ${{ needs.scope.outputs.coverage-other-matrix }}
      browser-packages: ${{ needs.scope.outputs.browser-packages }}
      browser-matrix: ${{ needs.scope.outputs.browser-matrix }}
      pack-matrix: ${{ needs.scope.outputs.pack-matrix }}
      coverage-required: ${{ needs.scope.outputs.coverage-required }}
      mutation-targets: ${{ needs.scope.outputs.mutation-targets }}
      mutation-classification: ${{ needs.scope.outputs.mutation-classification }}
      mutation-matrix: ${{ needs.scope.outputs.mutation-matrix }}
      partition-targets: ${{ needs.scope.outputs.partition-targets }}
      sdk: ${{ needs.scope.outputs.sdk }}
      did: ${{ needs.scope.outputs.did }}
      wallet: ${{ needs.scope.outputs.wallet }}
      wallet_client: ${{ needs.scope.outputs.wallet_client }}
      wallet_mobile: ${{ needs.scope.outputs.wallet_mobile }}
      verifast: ${{ needs.scope.outputs.verifast }}
    steps:
      - name: Record the selected lanes
        env:
          DIRECT_PROJECTS: ${{ needs.scope.outputs.direct-projects }}
        run: |
          echo "Direct packages: $DIRECT_PROJECTS"

  package-artifacts:
    name: Package artifacts and documentation consumers (${{ matrix.shard }}/${{ matrix.total }})
    if: always() && !cancelled() && needs.prepare.result == 'success'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.pack-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Restore the npm download cache for clean consumer installs
        # npm verifies every cached tarball against its integrity hash, so the
        # consumers stay clean installs without re-downloading the registry.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-consumers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: npm-consumers-${{ runner.os }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Compile documentation examples against exact package tarballs
        if: matrix.shard == 1 && needs.prepare.outputs.direct-projects != '[]'
        env:
          DOC_EXAMPLE_DIRECT_PROJECTS: ${{ needs.prepare.outputs.direct-projects }}
          DOC_EXAMPLE_PREBUILT_PROJECTS: ${{ needs.prepare.outputs.build-projects }}
        run: pnpm docs:examples

      - name: Verify changed package artifacts
        env:
          SHARD_PACKAGES: ${{ toJSON(matrix.packages) }}
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          filters=()
          while IFS= read -r package; do filters+=(--filter "$package"); done < <(
            jq -r '.[]' <<<"$SHARD_PACKAGES"
          )
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "No changed package artifact requires verification in this shard."
          else
            # Pack the outputs restored from the shared build instead of
            # rebuilding each package; packing runs no build lifecycle script.
            pnpm -r --no-sort "${filters[@]}" exec node \
              "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
              --if-present --script pack:check
          fi

      - name: Dry-run the npm artifact supply-chain boundary
        if: matrix.shard == 1
        run: |
          output="$RUNNER_TEMP/npm-release-artifacts"
          node scripts/package-release-artifacts.mjs stage \
            --output "$output" \
            --package @bsv/sdk \
            --include-published
          node scripts/package-release-artifacts.mjs verify "$output/manifest.json"
          node scripts/package-release-artifacts.mjs publish \
            "$output/manifest.json" \
            --dry-run

  mutation-tests:
    name: Mutation / ${{ matrix.target }} / ${{ matrix.partition }}
    # Analyzer failures stop expensive qualification; explicit diagnostics only
    # collect evidence and never waive the required final analyzer/merge gates.
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mutation-targets && needs.prepare.outputs.mutation-targets != '[]' &&
      (needs.sonar-zero-findings.result == 'success' ||
       (github.event_name != 'pull_request' && needs.sonar-zero-findings.result == 'skipped') ||
       contains(github.event.pull_request.labels.*.name, 'ci:mutation-diagnostics') ||
       (github.event_name == 'workflow_dispatch' && inputs.mutation-diagnostics))
    needs:
      - prepare
      - sonar-zero-findings
    runs-on: ubuntu-latest
    # The governed air-gap codec target currently instruments 352 mutants and
    # legitimately exceeds 20 minutes on a hosted runner.
    timeout-minutes: ${{ contains(fromJSON('["revenue-lineage-package","revenue-lineage-graph","sdk-revenue-listing-funding","output-lookup-session-records","output-lookup-session-payloads","wallet-recovery-codec","wallet-recovery-installation","wallet-recovery-store","wallet-funding-store","wallet-recovery-transitions","wallet-recovery-controller","root-eviction-storage","root-eviction-journal","root-eviction-records","wallet-retained-snapshot","wallet-snapshot-sync","wallet-snapshot-sync-destination","wallet-snapshot-sync-rows","wallet-snapshot-archive","wallet-snapshot-remote-http"]'), matrix.target) && 90 || 45 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.mutation-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - name: Restore build outputs
        run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Enforce the affected mutation-quality ratchet
        run: node scripts/mutation-testing.mjs --target "${{ matrix.target }}" --partition "${{ matrix.partition }}"
      - name: Capture complete execution-partition evidence
        if: matrix.partition != 'whole'
        run: |
          node scripts/mutation-partition-evidence.mjs capture --mode diagnostic \
            --target "${{ matrix.target }}" --partition "${{ matrix.partition }}" \
            --directory "artifacts/mutation/${{ matrix.target }}/${{ matrix.partition }}"
      - name: Preserve the machine-readable mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ matrix.target }}-${{ matrix.partition }}
          path: artifacts/mutation/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  mutation-quality:
    name: Mutation quality
    if: always()
    needs:
      - prepare
      - mutation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify the affected mutation targets
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MUTATION_RESULT: ${{ needs.mutation-tests.result }}
          MUTATION_TARGETS: ${{ needs.prepare.outputs.mutation-targets }}
          MUTATION_CLASSIFICATION: ${{ needs.prepare.outputs.mutation-classification }}
          MUTATION_MATRIX: ${{ needs.prepare.outputs.mutation-matrix }}
          PARTITION_TARGETS: ${{ needs.prepare.outputs.partition-targets }}
        run: |
          if [[ "$PREPARE_RESULT" != "success" ||
                ( "$MUTATION_RESULT" != "success" &&
                  ( "$MUTATION_RESULT" != "skipped" || "$MUTATION_TARGETS" != "[]" ) ) ]]; then
            echo "::error::Mutation quality failed: prepare=$PREPARE_RESULT mutation=$MUTATION_RESULT"
            exit 1
          fi
          "${NODE_EXECUTABLE:-node}" --input-type=module <<'NODE'
          const matrix = JSON.parse(process.env.MUTATION_MATRIX)
          const actual = JSON.parse(process.env.PARTITION_TARGETS)
          if (!Array.isArray(matrix.include) || !Array.isArray(actual) ||
              actual.some(target => typeof target !== 'string') || new Set(actual).size !== actual.length)
            throw new Error('Invalid canonical partition selection')
          const expected = [...new Set(matrix.include.filter(row => row.partition !== 'whole').map(row => row.target))].sort()
          if (JSON.stringify([...actual].sort()) !== JSON.stringify(expected))
            throw new Error('Canonical partition targets do not match the execution matrix')
          NODE
          echo '### Required PR mutation qualification' >> "$GITHUB_STEP_SUMMARY"
          echo "Required targets: $MUTATION_TARGETS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deferred, not passed: $(jq -c '.deferred' <<<"$MUTATION_CLASSIFICATION")" >> "$GITHUB_STEP_SUMMARY"
          echo 'Full qualification is required separately at the exact publication candidate.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install pinned partition aggregate verifier
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        with:
          pattern: mutation-*
          path: .mutation-parts-raw
      - name: Require every selected canonical partition target gate
        if: needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        env:
          PARTITION_TARGETS: ${{ needs.prepare.outputs.partition-targets }}
          MUTATION_MATRIX: ${{ needs.prepare.outputs.mutation-matrix }}
        run: |
          # Stage each target's parts by their exact matrix artifact names, so a
          # target whose ID prefixes another can never pick up foreign evidence.
          TARGET_LINES=$(jq -er '.[]' <<<"$PARTITION_TARGETS")
          while IFS= read -r target; do
            mkdir -p ".mutation-parts/$target"
            while IFS= read -r partition; do
              artifact=".mutation-parts-raw/mutation-$target-$partition"
              if [ ! -d "$artifact" ]; then
                echo "::error::Missing mutation partition evidence $target/$partition"
                exit 1
              fi
              cp -R "$artifact" ".mutation-parts/$target/"
            done < <(jq -er --arg target "$target" \
              '.include[] | select(.target == $target and .partition != "whole") | .partition' \
              <<<"$MUTATION_MATRIX")
          done <<<"$TARGET_LINES"
          while IFS= read -r target; do
            node scripts/mutation-partition-evidence.mjs verify --mode diagnostic \
              --target "$target" --directory ".mutation-parts/$target" \
              --output "artifacts/mutation/$target"
          done <<<"$TARGET_LINES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && needs.prepare.outputs.partition-targets != '[]' && needs.prepare.outputs.partition-targets != ''
        with:
          name: mutation-partition-canonical
          path: artifacts/mutation
          if-no-files-found: ignore
          retention-days: 30

  standard-tests:
    name: Tests / non-coverage packages
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.standard-packages != '[]'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - name: Restore build outputs
        run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Run affected suites without a coverage script
        env:
          STANDARD_PACKAGES: ${{ needs.prepare.outputs.standard-packages }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(jq -r '.[]' <<<"$STANDARD_PACKAGES")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No affected packages require the non-coverage test lane."
            exit 0
          fi

          filters=()
          echo "Non-coverage test lane:"
          for package in "${packages[@]}"; do
            echo "  - $package"
            filters+=(--filter "$package")
          done
          pnpm -r "${filters[@]}" run test

  dependent-tests:
    name: Tests / affected dependents (${{ matrix.shard }}/${{ matrix.total }})
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.dependent-test-packages != '[]'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.dependent-test-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore the immutable MongoDB test binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Run affected dependent regressions without regenerating coverage
        env:
          SHARD_PACKAGES: ${{ toJSON(matrix.packages) }}
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(jq -r '.[]' <<<"$SHARD_PACKAGES")

          if printf '%s\n' "${packages[@]}" | grep -Fxq '@bsv/wallet-toolbox'; then
            pnpm --filter @bsv/wallet-toolbox rebuild better-sqlite3
          fi
          if printf '%s\n' "${packages[@]}" | grep -Fxq '@bsv/overlay-topics'; then
            pnpm --filter @bsv/overlay-topics exec node --input-type=module -e \
              "import { MongoMemoryServer } from 'mongodb-memory-server'; const s = await MongoMemoryServer.create({ instance: { launchTimeout: 120000 } }); await s.stop(); console.log('mongodb-memory-server binary cache warmed');"
          fi

          echo "Affected dependent test shard ${{ matrix.shard }}/${{ matrix.total }}:"
          for package in "${packages[@]}"; do
            echo "  - $package"
          done
          # Serial and timed, so governance/ci-lane-durations.json can be
          # refreshed from hosted runs.
          for package in "${packages[@]}"; do
            started=$SECONDS
            pnpm --filter "$package" exec node \
              "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
              --script test
            echo "dependent-test-duration $package $((SECONDS - started))s"
          done

  browser-packages:
    name: Platform / browser packages (${{ matrix.shard }}/${{ matrix.total }})
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.browser-packages != '[]'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.browser-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild the audited browser bundler
        run: pnpm rebuild esbuild
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - name: Restore build outputs
        run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Verify affected exact-tarball browser consumers
        env:
          BROWSER_PACKAGES: ${{ needs.prepare.outputs.browser-packages }}
          BROWSER_COMPOSITION_DIRECTORY: ${{ github.workspace }}/.browser-composition
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          packages=()
          index=0
          while IFS= read -r package; do
            if [ $((index % ${{ matrix.total }} + 1)) -eq "${{ matrix.shard }}" ]; then
              packages+=("$package")
            fi
            index=$((index + 1))
          done < <(jq -r '.[]' <<<"$BROWSER_PACKAGES")

          filters=()
          echo "Browser consumer shard ${{ matrix.shard }}/${{ matrix.total }}:"
          for package in "${packages[@]}"; do
            echo "  - $package"
            filters+=(--filter "$package")
          done
          if [ "${#filters[@]}" -gt 0 ]; then
            pnpm -r --no-sort "${filters[@]}" exec node \
              "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
              --script test:browser
          else
            echo "No affected browser packages in this shard."
          fi
      - name: Retain exact browser composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-composition-${{ matrix.shard }}
          path: .browser-composition/
          if-no-files-found: ignore
          retention-days: 30

  wallet-browser-platform:
    name: Platform / wallet browser
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.wallet_client == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Verify packed browser consumer with Vite and esbuild
        env:
          BROWSER_COMPOSITION_DIRECTORY: ${{ github.workspace }}/.browser-composition
        run: pnpm --filter @bsv/wallet-toolbox-client run test:browser
      - name: Retain wallet browser composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-composition-wallet
          path: .browser-composition/
          if-no-files-found: ignore
          retention-days: 30

  wallet-mobile-platform:
    name: Platform / wallet mobile
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.wallet_mobile == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Verify packed mobile consumer with Metro and Hermes and retain source coverage
        run: |
          pnpm --filter @bsv/wallet-toolbox-mobile run test:mobile
          pnpm --filter @bsv/wallet-toolbox-mobile run test:coverage
          node scripts/normalize-lcov-paths.mjs \
            packages/wallet/wallet-toolbox/mobile/coverage/lcov.info \
            packages/wallet/wallet-toolbox
          mkdir -p .coverage-output
          cp packages/wallet/wallet-toolbox/mobile/coverage/lcov.info \
            .coverage-output/wallet-mobile.lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-wallet-mobile
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-sdk:
    name: Coverage / SDK (${{ matrix.shard }}/2)
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.sdk == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Generate an SDK coverage shard
        # Shards follow measured per-file durations. Each sees part of the
        # coverage, so the SDK's global thresholds are enforced on the merged
        # shards by coverage-sdk-thresholds.
        env:
          JEST_SHARD_DURATIONS: ${{ github.workspace }}/governance/ci-lane-durations.json
          JEST_SHARD_LANE: sdk-coverage
        run: |
          pnpm --filter @bsv/sdk exec jest --coverage --watchman=false \
            --coverageThreshold='{}' \
            --coverageReporters=json --coverageReporters=lcov \
            --shard="${{ matrix.shard }}/2" \
            --testSequencer="$GITHUB_WORKSPACE/scripts/jest-duration-sequencer.cjs"
          node scripts/normalize-lcov-paths.mjs packages/sdk/coverage/lcov.info packages/sdk
          mkdir -p .coverage-output .coverage-json
          cp packages/sdk/coverage/lcov.info .coverage-output/sdk-${{ matrix.shard }}.lcov.info
          cp packages/sdk/coverage/coverage-final.json .coverage-json/sdk-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-sdk-${{ matrix.shard }}
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-coverage-map-${{ matrix.shard }}
          path: .coverage-json/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-sdk-thresholds:
    name: Coverage / SDK thresholds
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.sdk == 'true' && needs.coverage-sdk.result == 'success'
    needs:
      - prepare
      - coverage-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @bsv/sdk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-coverage-map-*
          path: .sdk-coverage
          merge-multiple: true
      - name: Enforce the SDK coverage thresholds on the merged shards
        run: >-
          node scripts/check-merged-coverage-thresholds.mjs
          --package packages/sdk
          --coverage-directory .sdk-coverage

  sdk-browser-contract:
    name: Platform / SDK browser contract
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.sdk == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Verify the packed SDK browser consumer and UMD contract
        env:
          BROWSER_COMPOSITION_DIRECTORY: ${{ github.workspace }}/.browser-composition
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          pnpm --filter @bsv/sdk exec node \
            "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
            --script test:browser
      - name: Retain SDK browser composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-composition-sdk
          path: .browser-composition/
          if-no-files-found: ignore
          retention-days: 30

  coverage-did:
    name: Coverage / DID
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.did == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Generate DID coverage
        run: |
          pnpm --filter @bsv/did run test:coverage
          node scripts/normalize-lcov-paths.mjs packages/helpers/did/coverage/lcov.info packages/helpers/did
          mkdir -p .coverage-output
          cp packages/helpers/did/coverage/lcov.info .coverage-output/did.lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-did
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-wallet:
    name: Coverage / wallet-toolbox (${{ matrix.id }})
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.wallet == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: shard-1, shard: 1 }
          - { id: shard-2, shard: 2 }
          - { id: shard-3, shard: 3 }
          - { id: shard-4, shard: 4 }
          - { id: shard-5, shard: 5 }
          - { id: shard-6, shard: 6 }
          - { id: sync-http-0, latency: 0 }
          - { id: sync-http-1000, latency: 1000 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres for the Knex storage suites
        # Postgres 17-alpine, pinned by digest. Runs in the background while the
        # toolchain installs; the shard waits for it to report healthy before
        # Jest starts. Only the storage shards (RUNPOSTGRES) use it.
        if: matrix.shard
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker run --detach --name postgres
          --env POSTGRES_PASSWORD
          --publish 5432:5432
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 2s --health-timeout 5s --health-retries 60
          postgres@sha256:d5daad18926b71c3d663f358af0aea798670cb79fb550c106d19662a9d1627ef
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build allowlisted better-sqlite3 binding
        working-directory: packages/wallet/wallet-toolbox
        run: pnpm rebuild better-sqlite3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Restore the synced mainnet header store
        # ChaintracksStorageKnex's synced-store test assumes stored headers; a
        # fresh store first downloads about 75 MB of mainnet headers from the
        # header CDN. The key follows the storage code that writes the store.
        if: matrix.shard
        id: header-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/wallet/wallet-toolbox/src/services/chaintracker/chaintracks/__tests/data/mainNet_chaintracks.sqlite
          key: chaintracks-mainnet-${{ hashFiles('packages/wallet/wallet-toolbox/src/services/chaintracker/chaintracks/Storage/**', 'packages/wallet/wallet-toolbox/src/services/chaintracker/chaintracks/util/**') }}
      - name: Generate wallet-toolbox coverage shard
        env:
          WALLET_SHARD: ${{ matrix.shard }}
          SYNC_LATENCY: ${{ matrix.latency }}
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The two real-HTTP latency scenarios run in independent processes;
          # their global transport spies must never overlap in one Jest worker.
          args=(--coverage --coverageDirectory=coverage/${{ matrix.id }})
          if [ -n "$WALLET_SHARD" ]; then
            for attempt in $(seq 1 120); do
              status=$(docker inspect --format '{{.State.Health.Status}}' postgres)
              [ "$status" = healthy ] && break
              if [ "$status" = unhealthy ] || [ "$attempt" -eq 120 ]; then
                docker logs postgres
                echo "::error::Postgres did not become healthy (status: $status)"
                exit 1
              fi
              sleep 1
            done
            export RUNPOSTGRES=1
            POSTGRES_CONNECTION="$(jq -cn --arg password "$POSTGRES_PASSWORD" \
              '{host: "127.0.0.1", port: 5432, user: "postgres", password: $password, database: "postgres"}')"
            export POSTGRES_CONNECTION
            args+=(--testPathIgnorePatterns='man.test.ts|bench.test.ts|test/monitor/Monitor.test.ts|client/test|mobile/test|src/storage/sync/syncTransferHttp.test.ts')
            # Shards follow measured per-file durations, longest first.
            export JEST_SHARD_DURATIONS="$GITHUB_WORKSPACE/governance/ci-lane-durations.json"
            export JEST_SHARD_LANE=wallet-toolbox-coverage
            args+=(--shard="$WALLET_SHARD/6")
            args+=(--testSequencer="$GITHUB_WORKSPACE/scripts/jest-duration-sequencer.cjs")
          else
            args+=(--runInBand --runTestsByPath src/storage/sync/syncTransferHttp.test.ts)
            args+=(--testNamePattern="with $SYNC_LATENCY ms request latency")
          fi
          pnpm --filter @bsv/wallet-toolbox exec jest "${args[@]}"
          node scripts/normalize-lcov-paths.mjs \
            packages/wallet/wallet-toolbox/coverage/${{ matrix.id }}/lcov.info \
            packages/wallet/wallet-toolbox
          mkdir -p .coverage-output
          cp packages/wallet/wallet-toolbox/coverage/${{ matrix.id }}/lcov.info \
            .coverage-output/wallet-${{ matrix.id }}.lcov.info
      - name: Save the synced mainnet header store
        if: >-
          matrix.shard && steps.header-store.outputs.cache-hit != 'true' &&
          hashFiles('packages/wallet/wallet-toolbox/src/services/chaintracker/chaintracks/__tests/data/mainNet_chaintracks.sqlite') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/wallet/wallet-toolbox/src/services/chaintracker/chaintracks/__tests/data/mainNet_chaintracks.sqlite
          key: ${{ steps.header-store.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-wallet-${{ matrix.id }}
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-wallet-monitor:
    name: Coverage / wallet-toolbox monitor
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.wallet == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build allowlisted better-sqlite3 binding
        working-directory: packages/wallet/wallet-toolbox
        run: pnpm rebuild better-sqlite3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Generate wallet-toolbox monitor coverage
        run: |
          pnpm --filter @bsv/wallet-toolbox exec jest \
            test/monitor/Monitor.test.ts \
            --coverage \
            --coverageDirectory=coverage/monitor \
            --runInBand
          node scripts/normalize-lcov-paths.mjs \
            packages/wallet/wallet-toolbox/coverage/monitor/lcov.info \
            packages/wallet/wallet-toolbox
          mkdir -p .coverage-output
          cp packages/wallet/wallet-toolbox/coverage/monitor/lcov.info \
            .coverage-output/wallet-monitor.lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-wallet-monitor
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-verifast:
    name: Coverage / VeriFast
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.verifast == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Generate VeriFast coverage and run packaged-consumer checks
        env:
          BROWSER_COMPOSITION_DIRECTORY: ${{ github.workspace }}/.browser-composition
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          pnpm --filter @bsv/verifast exec node \
            "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
            --script test:coverage
          pnpm --filter @bsv/verifast exec node scripts/test-node-consumers.mjs
          pnpm --filter @bsv/verifast exec node scripts/test-browser-bundler.mjs
          pnpm --filter @bsv/verifast exec node \
            "$GITHUB_WORKSPACE/scripts/check-browser-package.mjs" .
          node scripts/normalize-lcov-paths.mjs packages/verifast/coverage/lcov.info packages/verifast
          mkdir -p .coverage-output
          cp packages/verifast/coverage/lcov.info .coverage-output/verifast.lcov.info
      - name: Retain VeriFast browser composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-composition-verifast
          path: .browser-composition/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-verifast
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-other:
    name: Coverage / other affected packages (${{ matrix.shard }}/${{ matrix.total }})
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.coverage-other-packages != '[]'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.coverage-other-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore the immutable MongoDB test binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-outputs
          path: .ci-artifacts
      - run: tar --extract --gzip --file .ci-artifacts/build-outputs.tar.gz
      - name: Generate coverage for other affected packages
        env:
          SHARD_PACKAGES: ${{ toJSON(matrix.packages) }}
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
          PREBUILT_PACKAGE_OUTPUTS: '1'
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(jq -r '.[]' <<<"$SHARD_PACKAGES")

          echo "Coverage shard ${{ matrix.shard }}/${{ matrix.total }}:"
          for package in "${packages[@]}"; do
            echo "  - $package"
          done
          if printf '%s\n' "${packages[@]}" | grep -Fxq '@bsv/overlay-topics'; then
            pnpm --filter @bsv/overlay-topics exec node --input-type=module -e \
              "import { MongoMemoryServer } from 'mongodb-memory-server'; const s = await MongoMemoryServer.create({ instance: { launchTimeout: 120000 } }); await s.stop(); console.log('mongodb-memory-server binary cache warmed');"
          fi
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No affected coverage packages in this shard."
          fi
          # Serial, one package at a time, timed so the lane durations can be
          # refreshed from hosted runs (governance/ci-lane-durations.json).
          echo '| Package | Seconds |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for package in "${packages[@]}"; do
            started=$SECONDS
            pnpm --filter "$package" exec node \
              "$GITHUB_WORKSPACE/scripts/run-prebuilt-package-script.mjs" \
              --script test:coverage
            elapsed=$((SECONDS - started))
            echo "coverage-other-duration $package ${elapsed}s"
            echo "| \`$package\` | $elapsed |" >> "$GITHUB_STEP_SUMMARY"
          done

          while IFS= read -r report; do
            package_dir="${report%/coverage/lcov.info}"
            node scripts/normalize-lcov-paths.mjs "$report" "$package_dir"
          done < <(find packages -type f -path '*/coverage/lcov.info' | sort)

          mkdir -p .coverage-output
          while IFS= read -r report; do
            # The aggregate lane and the patch-coverage gate both collect
            # *.lcov.info, so the suffix has to be a dot — a flattened
            # "..._coverage_lcov.info" name is silently ignored by both.
            artifact_name="$(printf '%s' "${report%/coverage/lcov.info}" | tr '/' '_').lcov.info"
            cp "$report" ".coverage-output/${artifact_name}"
          done < <(find packages -type f -path '*/coverage/lcov.info' | sort)
          echo "Coverage-capable packages are tested in this lane; packages without"
          echo "a coverage script are tested by the non-coverage lane." > .coverage-output/partition.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-other-${{ matrix.shard }}
          path: .coverage-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-upload:
    name: Coverage / aggregate upload
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.coverage-required == 'true' &&
      (needs.coverage-other.result == 'success' || needs.coverage-other.result == 'skipped') &&
      (needs.coverage-sdk.result == 'success' || needs.coverage-sdk.result == 'skipped') &&
      (needs.coverage-did.result == 'success' || needs.coverage-did.result == 'skipped') &&
      (needs.coverage-wallet.result == 'success' || needs.coverage-wallet.result == 'skipped') &&
      (needs.coverage-wallet-monitor.result == 'success' || needs.coverage-wallet-monitor.result == 'skipped') &&
      (needs.wallet-mobile-platform.result == 'success' || needs.wallet-mobile-platform.result == 'skipped') &&
      (needs.coverage-verifast.result == 'success' || needs.coverage-verifast.result == 'skipped')
    needs:
      - prepare
      - coverage-sdk
      - coverage-did
      - coverage-wallet
      - coverage-wallet-monitor
      - wallet-mobile-platform
      - coverage-verifast
      - coverage-other
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gate compares emitted JavaScript to distinguish declaration-only
      # edits from executable changes. LCOV intentionally has no interfaces.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 24.22.1
      - name: Install the locked patch-coverage compiler
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @bsv/ts-stack
          pnpm rebuild esbuild
          node --input-type=module -e "import { runtimeComparisonAvailable } from './scripts/patch-coverage.mjs'; if (!runtimeComparisonAvailable()) throw new Error('Patch coverage requires the locked compiler.');"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .coverage-artifacts
          merge-multiple: true
      - name: Compose Codecov inputs
        id: cov
        run: |
          FILES="$(find .coverage-artifacts -type f -name '*.lcov.info' | sort | paste -sd, -)"
          if [ -n "$FILES" ]; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-coverage=false" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Enforce the repository-owned 90% patch-coverage gate
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/patch-coverage.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --lcov-directory .coverage-artifacts
          --target 90

      - name: SonarQube Cloud scan and quality gate
        # SONAR_CI_ENABLED is flipped only after a Sonar organization admin
        # disables Automatic Analysis; the two methods cannot run together.
        # Dependabot changes are covered by audit + dependency review and do
        # not receive Actions secrets.
        if: vars.SONAR_CI_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage-report:
    name: Coverage / external reporting
    if: always() && !cancelled() && needs.coverage-upload.result == 'success' && needs.prepare.outputs.coverage-required == 'true'
    needs: [prepare, coverage-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .coverage-artifacts
          merge-multiple: true
      - name: Compose Codecov inputs
        id: cov
        run: |
          FILES="$(find .coverage-artifacts -type f -name '*.lcov.info' | sort | paste -sd, -)"
          if [ -n "$FILES" ]; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-coverage=false" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Public fork PRs use the pinned action's tokenless mode. GitHub does not
      # expose repository secrets to these pull_request runs; no privileged
      # trigger or OIDC/write permission is needed. Their advisory codecov/patch
      # status must be produced just like same-repository PRs.
      - name: Upload coverage to Codecov
        if: steps.cov.outputs.has-coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.cov.outputs.files }}
          # Make the current attempt distinguishable from a previous rerun of
          # the same commit when waiting for Codecov to finish processing it.
          name: ts-stack-${{ github.run_id }}-${{ github.run_attempt }}
          slug: bsv-blockchain/ts-stack
          # CI checks out GitHub's synthetic PR merge commit but Codecov
          # reports against the branch head.  Give Codecov the actual base
          # parent so it does not fall back to its last covered main commit.
          commit_parent: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Coverage upload is non-blocking: Codecov CLI GPG-verify/outages must not gate CI.
          fail_ci_if_error: false

      - name: Wait for Codecov to merge the uploaded report
        if: steps.cov.outputs.has-coverage == 'true'
        env:
          CODECOV_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CODECOV_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODECOV_UPLOAD_NAME: ts-stack-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          deadline=$((SECONDS + 300))
          commit_url="https://api.codecov.io/api/v2/github/bsv-blockchain/repos/ts-stack/commits/${CODECOV_COMMIT}/"
          uploads_url="${commit_url}uploads/"
          while true; do
            if commit=$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 15 "$commit_url") &&
              [ "$(jq --raw-output '.state // empty' <<<"$commit")" = 'complete' ] &&
              uploads=$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 15 "$uploads_url") &&
              [ "$(jq --arg build_url "$CODECOV_BUILD_URL" --arg name "$CODECOV_UPLOAD_NAME" '[.results[]? | select(.build_url == $build_url and .name == $name and .state_name == "MERGED")] | length' <<<"$uploads")" -gt 0 ]; then
              echo "Codecov merged ${CODECOV_UPLOAD_NAME} for ${CODECOV_COMMIT}."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Codecov did not merge coverage for ${CODECOV_COMMIT} within five minutes."
              exit 1
            fi
            sleep 5
          done

      - name: Publish finalized Codecov notifications
        if: steps.cov.outputs.has-coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: bsv-blockchain/ts-stack
          run_command: send-notifications
          # Notification delivery is non-blocking for the same reason as upload.
          fail_ci_if_error: false

  build-and-test:
    name: build-and-test (24.x)
    if: always()
    needs:
      - prepare
      - policy
      - standard-tests
      - dependent-tests
      - browser-packages
      - coverage-upload
      - wallet-browser-platform
      - wallet-mobile-platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify parallel build, test, and coverage lanes
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          TEST_RESULT: ${{ needs.standard-tests.result }}
          DEPENDENT_TEST_RESULT: ${{ needs.dependent-tests.result }}
          PACKAGE_BROWSER_RESULT: ${{ needs.browser-packages.result }}
          COVERAGE_RESULT: ${{ needs.coverage-upload.result }}
          BROWSER_RESULT: ${{ needs.wallet-browser-platform.result }}
          MOBILE_RESULT: ${{ needs.wallet-mobile-platform.result }}
        run: |
          if [[ "$PREPARE_RESULT" != "success" ||
                "$POLICY_RESULT" != "success" ||
                ( "$TEST_RESULT" != "success" && "$TEST_RESULT" != "skipped" ) ||
                ( "$DEPENDENT_TEST_RESULT" != "success" && "$DEPENDENT_TEST_RESULT" != "skipped" ) ||
                ( "$PACKAGE_BROWSER_RESULT" != "success" && "$PACKAGE_BROWSER_RESULT" != "skipped" ) ||
                ( "$COVERAGE_RESULT" != "success" && "$COVERAGE_RESULT" != "skipped" ) ||
                ( "$BROWSER_RESULT" != "success" && "$BROWSER_RESULT" != "skipped" ) ||
                ( "$MOBILE_RESULT" != "success" && "$MOBILE_RESULT" != "skipped" ) ]]; then
            echo "::error::Build/test lanes failed: prepare=$PREPARE_RESULT policy=$POLICY_RESULT direct-tests=$TEST_RESULT dependent-tests=$DEPENDENT_TEST_RESULT package-browser=$PACKAGE_BROWSER_RESULT coverage=$COVERAGE_RESULT wallet-browser=$BROWSER_RESULT mobile=$MOBILE_RESULT"
            exit 1
          fi

  infra-scope:
    name: Detect affected infrastructure
    needs:
      - early-gates
      - scope
    if: always() && !cancelled() && needs.early-gates.result == 'success' && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ needs.scope.outputs.infra-matrix }}
      has-infra: ${{ needs.scope.outputs.has-infra }}
    steps:
      - name: Confirm dependency-aware component selection
        env:
          INFRA_MATRIX: ${{ needs.scope.outputs.infra-matrix }}
        run: |
          echo "Selected infrastructure: $(jq -c '[.include[].display]' <<<"$INFRA_MATRIX")"

  infra:
    name: Infra / ${{ matrix.display }}
    if: always() && !cancelled() && needs.infra-scope.result == 'success' && needs.infra-scope.outputs.has-infra == 'true'
    needs: infra-scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.infra-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.run

      - name: Use Node.js 24
        if: matrix.run
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: infra/${{ matrix.component }}/package-lock.json

      - name: Install locked dependencies
        if: matrix.run
        working-directory: infra/${{ matrix.component }}
        run: npm ci --ignore-scripts

      - name: Build allowlisted native modules
        if: matrix.run && matrix.native-modules != ''
        working-directory: infra/${{ matrix.component }}
        env:
          NATIVE_MODULES: ${{ matrix.native-modules }}
        run: npm rebuild $NATIVE_MODULES

      - name: Reject high and critical dependency advisories
        if: matrix.run
        working-directory: infra/${{ matrix.component }}
        run: npm audit --audit-level=high

      - name: Build
        if: matrix.run
        working-directory: infra/${{ matrix.component }}
        run: npm run build --if-present

      - name: Lint
        if: matrix.run
        working-directory: infra/${{ matrix.component }}
        run: npm run lint --if-present

      - name: Test
        if: matrix.run
        working-directory: infra/${{ matrix.component }}
        run: npm test --if-present

      - name: Build Linux image
        if: matrix.run && matrix.component != 'uhrp-server-cloud-bucket/notifier'
        run: |
          # Anonymous base-image pulls can be throttled (HTTP 429). Back off
          # longer only for that; any other build failure keeps the short retry.
          set -o pipefail
          log="$RUNNER_TEMP/docker-build-${{ strategy.job-index }}.log"
          for attempt in 1 2 3 4 5; do
            if docker build --tag "ts-stack-${{ strategy.job-index }}:ci" "infra/${{ matrix.component }}" 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -qiE '429 Too Many Requests|toomanyrequests' "$log"; then
              limit=5
              delay=$((15 * (1 << (attempt - 1))))
            else
              limit=3
              delay=$((attempt * 5))
            fi
            if [ "$attempt" -ge "$limit" ]; then
              exit 1
            fi
            echo "::warning::Docker build attempt $attempt failed; retrying after $delay seconds."
            sleep "$delay"
          done
          exit 1

      - name: Reject high and critical image vulnerabilities
        if: matrix.run && matrix.component != 'uhrp-server-cloud-bucket/notifier'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ts-stack-${{ strategy.job-index }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 15m

  docs-validate:
    name: Docs Site Validation
    needs:
      - early-gates
      - scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on every PR (cheap and protects the docs site) and on pushes that touch docs
    # The build step inside will fail fast on frontmatter or link problems before they reach production
    if: >-
      always() && !cancelled() &&
      needs.early-gates.result == 'success' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.docs == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild the audited docs build tool
        run: pnpm rebuild esbuild

      - name: Check docs source quality
        run: |
          pnpm --filter docs-site format:check
          pnpm --filter docs-site lint
          pnpm --filter docs-site test
          pnpm --filter docs-site typecheck

      - name: Validate frontmatter + links (docs site)
        run: pnpm --filter docs-site validate

      - name: Build docs site
        # This was previously part of the serial full-workspace build. Running
        # it here preserves the SSG, pagefind, and built-link checks while
        # moving that CPU work off the package build/test critical path.
        run: pnpm --filter docs-site build

  conformance:
    name: Conformance Vectors
    needs:
      - early-gates
      - scope
    if: >-
      always() && !cancelled() &&
      needs.early-gates.result == 'success' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check structural conformance runner quality
        run: |
          pnpm --filter @bsv/conformance-runner format:check
          pnpm --filter @bsv/conformance-runner lint
          pnpm --filter @bsv/conformance-runner build

      - name: Validate conformance vectors (TS)
        run: cd conformance/runner && node src/runner.js --validate-only

      - name: Run conformance vectors (TS)
        run: cd conformance/runner && node src/runner.js --report ../reports/ts-report.xml

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-report
          path: conformance/reports/
          if-no-files-found: ignore

      # Published so downstream SDKs can fetch the shared conformance corpus
      # and run their own language-specific runners in their own CI.
      - name: Publish conformance vectors
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-vectors
          path: conformance/vectors/
          retention-days: 90

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block newly introduced high and critical vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  merge-gate:
    name: merge-gate
    if: always()
    needs:
      - scope
      - build
      - policy
      - prepare
      - package-artifacts
      - infra-scope
      - standard-tests
      - dependent-tests
      - browser-packages
      - wallet-browser-platform
      - wallet-mobile-platform
      - coverage-sdk
      - coverage-sdk-thresholds
      - sdk-browser-contract
      - coverage-did
      - coverage-wallet
      - coverage-wallet-monitor
      - coverage-verifast
      - coverage-other
      - coverage-upload
      - mutation-tests
      - repository-health
      - sonar-zero-findings
      - build-and-test
      - mutation-quality
      - infra
      - docs-validate
      - conformance
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Reject missing or skipped selected work
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
        run: node scripts/ci-result-gate.mjs
      - name: Verify every required CI result
        env:
          HEALTH_RESULT: ${{ needs.repository-health.result }}
          SONAR_RESULT: ${{ needs.sonar-zero-findings.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          MUTATION_RESULT: ${{ needs.mutation-quality.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          DOCS_RESULT: ${{ needs.docs-validate.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          if [[ "$HEALTH_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ||
                "$MUTATION_RESULT" != "success" ||
                ( "$INFRA_RESULT" != "success" && "$INFRA_RESULT" != "skipped" ) ||
                ( "$DOCS_RESULT" != "success" && "$DOCS_RESULT" != "skipped" ) ||
                ( "$CONFORMANCE_RESULT" != "success" && "$CONFORMANCE_RESULT" != "skipped" ) ]]; then
            echo "::error::Required CI failed: health=$HEALTH_RESULT build=$BUILD_RESULT mutation=$MUTATION_RESULT infra=$INFRA_RESULT docs=$DOCS_RESULT conformance=$CONFORMANCE_RESULT"
            exit 1
          fi
          if [[ "$SONAR_RESULT" != "success" && "$SONAR_RESULT" != "skipped" ]]; then
            echo "::error::Repository quality gate failed: exact-head Sonar analysis must contain zero new findings; sonar=$SONAR_RESULT"
            exit 1
          fi
          if [[ "$DEPENDENCY_RESULT" != "success" && "$DEPENDENCY_RESULT" != "skipped" ]]; then
            echo "::error::Dependency review failed: dependency-review=$DEPENDENCY_RESULT"
            exit 1
          fi
