version: 2

# One coordinated version-maintenance PR on the 1st and 15th of each month.
# Cron cannot express "every other week"; these fixed dates are the closest
# twice-monthly cadence. The open limit prevents a new queue from forming
# behind it. The Dependency lockfile refresh workflow then adds one commit
# re-resolving transitive dependencies within declared ranges; Dependabot stops
# rebasing after that commit, so merge or close the PR before the next run.
# Automated security-update PRs are disabled for the repository: Dependabot
# alerts stay on, and advisory fixes arrive through this grouped PR and its
# refresh (governance/dependency-release-policy.json#routineUpdates).
multi-ecosystem-groups:
  stack-maintenance:
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    pull-request-branch-name:
      separator: '-'

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/codegen/node
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7
    ignore:
      # First-party workspace versions are reconciled after publishing by
      # scripts/sync-versions.mjs and the release workflow. Ownership and
      # enforcement are recorded in projects.json#dependencyAutomation.
      - dependency-name: '@bsv/*'
      # The native TypeScript 7 compiler is current. Future compiler majors
      # remain coordinated migrations; patch/minor maintenance stays enabled.
      - dependency-name: '@typescript/native'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Infra services live outside the pnpm workspace and maintain package-lock
  # files. Dependabot can update them in the same grouped PR; release-time
  # version synchronization continues to own their @bsv/* ranges.
  - package-ecosystem: npm
    directories:
      - /infra/chaintracks-server
      - /infra/message-box-server
      - /infra/overlay-server
      - /infra/uhrp-server-basic
      - /infra/uhrp-server-cloud-bucket
      - /infra/uhrp-server-cloud-bucket/notifier
      - /infra/wab
      - /infra/wallet-infra
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    # The npm updater currently fetches unrelated ancestor pnpm support files
    # and mistakes these standalone package-lock projects for sub-workspaces.
    # GitHub forbids '..' in exclusion patterns. Recursive filename globs
    # match these support files at either depth; the root entry owns them.
    exclude-paths:
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
    cooldown:
      default-days: 7
    ignore:
      # Same release-aware first-party policy as the root workspace; see
      # governance/repository-health/projects.json#dependencyAutomation.
      - dependency-name: '@bsv/*'
      # Keep every standalone service on the same coordinated compiler major
      # as the root workspace while allowing TypeScript 7 patch/minor updates.
      - dependency-name: '@typescript/native'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Keep deployment manifests current. Runtime Dockerfiles are digest-only, so
  # exclude them from this scan: Dependabot treats their bare `node` dependency
  # as `latest`, even when it is ignored, and its multi-directory updater then
  # fails instead of producing a reviewable change. The readable, versioned
  # Node source under /governance owns base-image discovery; deployment image
  # and database updates remain in this entry.
  - package-ecosystem: docker
    directories:
      - /infra
      - /infra/chaintracks-server
      - /infra/message-box-server
      - /infra/overlay-server
      - /infra/overlay-server/deploy
      - /infra/uhrp-server-basic
      - /infra/uhrp-server-cloud-bucket
      - /infra/wab
      - /infra/wab/deploy
      - /infra/wallet-infra
      - /infra/wallet-infra/guides/kube_samples
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7
    exclude-paths:
      - Dockerfile
      - '**/Dockerfile'
    ignore:
      # Defense in depth if GitHub changes exclude-path handling.
      - dependency-name: node
      # Database majors require backup/restore, upgrade-path, rollback, and
      # application compatibility validation. Patch and minor refreshes remain
      # automated; each major migration requires its own reviewed issue.
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
      - dependency-name: mongo
        update-types:
          - version-update:semver-major
      # This documentation placeholder is replaced by each operator. Keep its
      # directory monitored so the real MySQL example continues to receive
      # digest and version updates.
      - dependency-name: your-registry/wallet-infra

  # Dependabot discovers readable Node version updates from the canonical
  # Docker Hub reference here. This file is never built. Other governed
  # registry mirrors are verified during review rather than queried by
  # Dependabot, avoiding transient public ECR rate-limit failures. Repository
  # health requires the version, governed digest, and all release Dockerfiles
  # to move together before the grouped PR can merge.
  - package-ecosystem: docker
    directory: /governance
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7
    ignore:
      # Node 24 is the owned contributor, CI, release, and container runtime.
      # A Node major moves only as a coordinated stack migration; patch/minor
      # image refreshes continue through this governed manifest.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: gomod
    directory: /tools/codegen
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /tools/codegen
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: stack-maintenance
    rebase-strategy: auto
    cooldown:
      default-days: 7
