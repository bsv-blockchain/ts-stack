version: 2

# One coordinated version-maintenance PR per month. This is the closest
# supported cadence to the requested "about every three weeks", and the open
# limit plus automatic rebasing prevents a new queue from forming behind it.
multi-ecosystem-groups:
  monthly-stack-maintenance:
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    pull-request-branch-name:
      separator: '-'

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/codegen/node
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto
    ignore:
      # First-party workspace versions are reconciled after publishing by
      # scripts/sync-versions.mjs and the release workflow. Ownership and
      # enforcement are recorded in projects.json#dependencyAutomation.
      - dependency-name: '@bsv/*'
      # TypeScript 7 currently fails the workspace build, codegen, conformance,
      # and multiple infrastructure lanes. It is a coordinated Wave 11
      # migration, not a routine monthly update; see the owned exception.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      root-security:
        applies-to: security-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@bsv/*'

  # Infra services live outside the pnpm workspace and maintain package-lock
  # files. Dependabot can update them in the same monthly PR; release-time
  # version synchronization continues to own their @bsv/* ranges.
  - package-ecosystem: npm
    directories:
      - /infra/chaintracks-server
      - /infra/message-box-server
      - /infra/overlay-server
      - /infra/uhrp-server-basic
      - /infra/uhrp-server-cloud-bucket
      - /infra/uhrp-server-cloud-bucket/notifier
      - /infra/wab
      - /infra/wallet-infra
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto
    ignore:
      # Same release-aware first-party policy as the root workspace; see
      # governance/repository-health/projects.json#dependencyAutomation.
      - dependency-name: '@bsv/*'
    groups:
      infra-security:
        applies-to: security-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@bsv/*'

  # Keep deployment manifests current. Runtime Dockerfiles are digest-only, so
  # ignore their bare `node` dependency here: a digest-only Dependabot update
  # would incorrectly resolve the registry's `latest` tag.
  - package-ecosystem: docker
    directories:
      - /infra
      - /infra/chaintracks-server
      - /infra/message-box-server
      - /infra/overlay-server
      - /infra/overlay-server/deploy
      - /infra/uhrp-server-basic
      - /infra/uhrp-server-cloud-bucket
      - /infra/wab
      - /infra/wab/deploy
      - /infra/wallet-infra
      - /infra/wallet-infra/guides/kube_samples
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto
    ignore:
      - dependency-name: node
      # This documentation placeholder is replaced by each operator. Keep its
      # directory monitored so the real MySQL example continues to receive
      # digest and version updates.
      - dependency-name: your-registry/wallet-infra

  # Dependabot discovers readable Node version updates here. This file is never
  # built; repository health requires its version, the governed digest, and all
  # release Dockerfiles to move together before the grouped PR can merge.
  - package-ecosystem: docker
    directory: /governance
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto

  - package-ecosystem: gomod
    directory: /tools/codegen
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto

  - package-ecosystem: uv
    directory: /tools/codegen
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: monthly-stack-maintenance
    rebase-strategy: auto
