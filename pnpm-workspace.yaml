packages:
  - 'packages/**'
  - '!packages/**/dist/**'
  - '!packages/**/out/**'
  - 'conformance/**'
  - 'apps/**'
  - 'docs-site'

# Supply-chain policy belongs in pnpm-workspace.yaml (pnpm 10 does not read
# these settings from package.json). Keep native lifecycle scripts deny-by-
# default, delay ordinary new releases for seven days, and reject provenance
# downgrades. First-party @bsv/* releases are exempt from the delay so a
# coordinated stack release can consume freshly published siblings.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  better-sqlite3: true
  esbuild: true
  mongodb-memory-server: true
  sqlite3: true
  unrs-resolver: true
# Reject registry-bypassing git, URL, and local references introduced by
# transitive dependencies. Workspace-owned direct links remain explicit.
blockExoticSubdeps: true
# Require manifests to declare their runtime and build peers explicitly. This
# keeps unused optional tooling peers out of the frozen dependency graph.
autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@bsv/*'

# Jest 30's current coverage/reporting graph still constrains minimatch to
# brace-expansion 1.x/2.x. Keep this narrow, tested substitution on the latest
# security-patched release until Jest adopts it directly.
overrides:
  brace-expansion@<5.0.11: 5.0.11
  # Socket.IO retains engine.io releases vulnerable to the protocol-revision
  # mismatch DoS. Select the first patched release; authsocket consumes the
  # same public API.
  engine.io@<6.6.10: 6.6.10
  # Vite's PostCSS graph permits nanoid 3 releases older than the security
  # fix. Select the first patched 3.x release without changing its public API.
  nanoid@<3.3.18: 3.3.18
  # remark-mdx-frontmatter 5.2.0 still constrains TOML to vulnerable 3.x even
  # though it only consumes the compatible parse() API. webpack-cli already
  # accepts TOML 4; keep both paths on the first release fixing the advisories.
  toml@<4.2.0: 4.2.0
  # Express/body-parser, Superagent, and Stryker's typed-rest-client can retain
  # vulnerable qs releases. Select the first release fixing the bracket/comma
  # array-limit and attacker-controlled isBuffer advisories across every path.
  qs@<6.16.0: 6.16.0
  # Jest's istanbul reporting chain (@istanbuljs/load-nyc-config, ts-jest,
  # jsdom, webpack-cli) still pulls js-yaml 3.15.1, affected by unbounded CPU
  # use on empty merge sources. Select the first patched 3.x release.
  js-yaml@<3.15.2: 3.15.2
  # Metro 0.87 still declares image-size ^1.0.2. Use the first maintained
  # release after the HEIF/JXL and ICNS non-progressing-parser advisories while
  # retaining Metro's CommonJS default-function contract. The mobile platform
  # gate exercises image dimensions, bundling, and Hermes compilation.
  'metro@0.87.0>image-size': 2.0.4
strictDepBuilds: true
trustPolicy: no-downgrade
# Apply provenance downgrade checks to the recent supply-chain window. Older
# packages predate consistent registry attestations and otherwise create known
# false positives (for example chokidar 4.0.3 in pnpm's own documentation).
trustPolicyIgnoreAfter: 525600
