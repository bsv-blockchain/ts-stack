packages:
  - 'packages/**'
  - '!packages/**/dist/**'
  - '!packages/**/out/**'
  - 'conformance/**'
  - 'apps/**'
  - 'docs-site'

# Supply-chain policy belongs in pnpm-workspace.yaml (pnpm 10 does not read
# these settings from package.json). Keep native lifecycle scripts deny-by-
# default, delay ordinary new releases for 24 hours, and reject provenance
# downgrades. First-party @bsv/* releases are exempt from the delay so a
# coordinated stack release can consume freshly published siblings.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  better-sqlite3: true
  esbuild: true
  mongodb-memory-server: true
  sqlite3: true
  unrs-resolver: true
strictDepBuilds: true
# Require manifests to declare their runtime and build peers explicitly. This
# keeps unused optional tooling peers out of the frozen dependency graph.
autoInstallPeers: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@bsv/*'
trustPolicy: no-downgrade
# Apply provenance downgrade checks to the recent supply-chain window. Older
# packages predate consistent registry attestations and otherwise create known
# false positives (for example chokidar 4.0.3 in pnpm's own documentation).
trustPolicyIgnoreAfter: 525600

# Jest 30's current coverage/reporting graph still constrains minimatch to
# brace-expansion 1.x/2.x. GHSA-mh99-v99m-4gvg is only fixed in 5.0.8, so keep
# this narrow, tested substitution until Jest adopts minimatch 10.2.5 or newer.
overrides:
  brace-expansion@<=5.0.7: 5.0.8
