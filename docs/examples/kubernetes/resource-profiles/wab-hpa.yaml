# Prerequisites: MySQL capacity for maxReplicas * WAB_DB_POOL_MAX and a shared
# gateway rate limit for authentication, SMS, faucet, deletion, and share APIs.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wab
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
