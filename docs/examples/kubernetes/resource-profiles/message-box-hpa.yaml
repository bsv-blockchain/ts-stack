# Prerequisites: shared MySQL sessions/replay/quota state and a shared gateway
# rate limit. Disable WebSockets or provide sticky routing / shared Socket.IO
# pub-sub before increasing replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-box-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-box-server
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
