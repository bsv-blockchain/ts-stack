# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file (.sonarcloud.properties), not
# sonar-project.properties. We exclude test files from copy-paste (duplication)
# detection: parallel test suites (e.g. SQLite vs IndexedDB variants of the same
# storage tests) legitimately duplicate large blocks, and tests are already
# excluded from sources/coverage analysis.
sonar.exclusions=packages/verifast/src/wasm/bdk-core.mjs,packages/verifast/src/wasm/bdk-core.browser.mjs,packages/verifast/src/wasm/bdk-core.umd.js
# The service rate-limit policy is one canonical source synchronized into four
# self-contained Docker build contexts and checked byte-for-byte in CI. Analyze
# every copy for issues, but do not report the intentional generated copies as
# source duplication.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.man.test.ts,**/__test__/**,**/__tests__/**,**/test/**,**/tests/**,**/*.vectors.ts,**/eslint.config.js,infra/wab/src/security/rateLimitPolicy.ts,infra/uhrp-server-basic/src/security/rateLimitPolicy.ts,infra/uhrp-server-cloud-bucket/src/security/rateLimitPolicy.ts,infra/message-box-server/src/security/rateLimitPolicy.ts
