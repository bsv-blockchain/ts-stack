# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file (.sonarcloud.properties), not
# sonar-project.properties. We exclude test files from copy-paste (duplication)
# detection: parallel test suites (e.g. SQLite vs IndexedDB variants of the same
# storage tests) legitimately duplicate large blocks, and tests are already
# excluded from sources/coverage analysis.
sonar.exclusions=packages/verifast/src/wasm/bdk-core.*,conformance/generated/**,docs-site/public/assets/asyncapi/**,packages/wallet/wallet-toolbox/docs/open-rpc/index.html,governance/Dockerfile.container-bases
# The shared rate-limit and edge policies are canonical sources synchronized
# into self-contained Docker/package build contexts and checked byte-for-byte
# in CI. Analyze the code for issues, but do not report intentional generated
# copies as source duplication.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.man.test.ts,**/__test__/**,**/__tests__/**,**/test/**,**/tests/**,**/*.vectors.ts,**/eslint.config.js,infra/wab/src/security/rateLimitPolicy.ts,infra/uhrp-server-basic/src/security/rateLimitPolicy.ts,infra/uhrp-server-cloud-bucket/src/security/rateLimitPolicy.ts,infra/message-box-server/src/security/rateLimitPolicy.ts,infra/uhrp-server-basic/src/security/edgePolicy.ts,infra/uhrp-server-cloud-bucket/src/security/edgePolicy.ts,infra/message-box-server/src/security/edgePolicy.ts,infra/chaintracks-server/src/security/edgePolicy.ts,packages/overlays/overlay-express/src/security/edgePolicy.ts,packages/wallet/wallet-toolbox/src/storage/remoting/edgePolicy.ts
# Narrow compatibility exceptions are registered with owner, evidence, review
# dates, and objective removal conditions in repository-health/exceptions.json.
sonar.issue.ignore.multicriteria=werrProtocolNames,curveSingletonAlias,curveSingletonReturn,scriptOpcodeDispatch
sonar.issue.ignore.multicriteria.werrProtocolNames.ruleKey=typescript:S101
sonar.issue.ignore.multicriteria.werrProtocolNames.resourceKey=**/WERR_*.ts
