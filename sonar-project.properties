sonar.organization=bsv
sonar.projectKey=bsv-blockchain_ts-stack
sonar.projectName=ts-stack
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=packages,conformance,scripts,.github/workflows
sonar.tests=packages,conformance
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/test/**,**/tests/**
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/.pnpm-store/**,\
**/package-lock.json,\
**/pnpm-lock.yaml,\
packages/verifast/src/wasm/bdk-core.mjs,\
packages/verifast/src/wasm/bdk-core.browser.mjs,\
packages/verifast/src/wasm/bdk-core.umd.js,\
**/fixtures/**,\
**/*.vectors.ts,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.man.test.ts,\
**/__test__/**,\
**/__tests__/**,\
**/test/**,\
**/tests/**,\
**/docs/**,\
**/docs-site/**,\
**/*.html,\
**/scripts/**,\
**/syncVersions.js,\
scripts/**,\
conformance/generated/**,\
conformance/reports/**,\
conformance/vectors/**,\
infra/**
# Exclude test files from duplication detection. Parallel test suites
# (e.g. DB vs IndexedDB variants) legitimately duplicate large blocks.
sonar.cpd.exclusions=**/eslint.config.js,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.man.test.ts,**/__test__/**,**/__tests__/**,**/test/**,**/tests/**,**/*.vectors.ts
# CI shards coverage-capable packages and restores their normalized LCOV files
# into one artifact directory before scanning. Keep the package-local glob for
# developer runs and the aggregate glob for Actions.
sonar.javascript.lcov.reportPaths=packages/**/coverage/lcov.info,packages/**/coverage/**/lcov.info,.coverage-artifacts/**/*.lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
