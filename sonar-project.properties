sonar.organization=bsv
sonar.projectKey=bsv-blockchain_ts-stack
sonar.projectName=ts-stack
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=packages,conformance,scripts,.github/workflows
sonar.tests=packages,conformance
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/test/**,**/tests/**
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/.pnpm-store/**,\
**/package-lock.json,\
**/pnpm-lock.yaml,\
packages/verifast/src/wasm/bdk-core.mjs,\
packages/verifast/src/wasm/bdk-core.browser.mjs,\
packages/verifast/src/wasm/bdk-core.umd.js,\
**/fixtures/**,\
**/*.vectors.ts,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.man.test.ts,\
**/__test__/**,\
**/__tests__/**,\
**/test/**,\
**/tests/**,\
**/docs/**,\
**/docs-site/**,\
**/*.html,\
**/scripts/**,\
**/syncVersions.js,\
scripts/**,\
conformance/generated/**,\
conformance/reports/**,\
conformance/vectors/**,\
infra/**
# Exclude test files from duplication detection. Parallel test suites
# (e.g. DB vs IndexedDB variants) legitimately duplicate large blocks.
sonar.cpd.exclusions=\
**/eslint.config.js,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.man.test.ts,\
**/__test__/**,\
**/__tests__/**,\
**/test/**,\
**/tests/**,\
**/*.vectors.ts,\
infra/uhrp-server-basic/src/security/edgePolicy.ts,\
infra/uhrp-server-cloud-bucket/src/security/edgePolicy.ts,\
infra/message-box-server/src/security/edgePolicy.ts,\
infra/chaintracks-server/src/security/edgePolicy.ts,\
packages/overlays/overlay-express/src/security/edgePolicy.ts,\
packages/wallet/wallet-toolbox/src/storage/remoting/edgePolicy.ts
# Keep CI and Automatic Analysis aligned on the same narrowly registered
# compatibility exceptions.
sonar.issue.ignore.multicriteria=werrProtocolNames,curveSingletonAlias,curveSingletonReturn,scriptOpcodeDispatch,scriptOpcodeComplexity,walletWireDispatch
sonar.issue.ignore.multicriteria.werrProtocolNames.ruleKey=typescript:S101
sonar.issue.ignore.multicriteria.werrProtocolNames.resourceKey=**/WERR_*.ts
sonar.issue.ignore.multicriteria.curveSingletonAlias.ruleKey=typescript:S7740
sonar.issue.ignore.multicriteria.curveSingletonAlias.resourceKey=packages/sdk/src/primitives/Curve.ts
sonar.issue.ignore.multicriteria.curveSingletonReturn.ruleKey=typescript:S6635
sonar.issue.ignore.multicriteria.curveSingletonReturn.resourceKey=packages/sdk/src/primitives/Curve.ts
sonar.issue.ignore.multicriteria.scriptOpcodeDispatch.ruleKey=typescript:S1479
sonar.issue.ignore.multicriteria.scriptOpcodeDispatch.resourceKey=packages/sdk/src/script/Spend.ts
sonar.issue.ignore.multicriteria.scriptOpcodeComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.scriptOpcodeComplexity.resourceKey=packages/sdk/src/script/Spend.ts
sonar.issue.ignore.multicriteria.walletWireDispatch.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.walletWireDispatch.resourceKey=packages/sdk/src/wallet/substrates/WalletWireProcessor.ts
# CI shards coverage-capable packages and restores their normalized LCOV files
# into one artifact directory before scanning. Keep the package-local glob for
# developer runs and the aggregate glob for Actions.
sonar.javascript.lcov.reportPaths=packages/**/coverage/lcov.info,packages/**/coverage/**/lcov.info,.coverage-artifacts/**/*.lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
