sonar.organization=bsv
sonar.projectKey=bsv-blockchain_ts-stack
sonar.projectName=ts-stack
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=packages,conformance,scripts
sonar.tests=packages,conformance
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/test/**,**/tests/**
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/.pnpm-store/**,\
**/package-lock.json,\
**/pnpm-lock.yaml,\
packages/verifast/src/wasm/bdk-core.mjs,\
**/fixtures/**,\
**/*.vectors.ts,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.man.test.ts,\
**/__test__/**,\
**/__tests__/**,\
**/test/**,\
**/tests/**,\
**/docs/**,\
**/docs-site/**,\
**/*.html,\
**/scripts/**,\
**/syncVersions.js,\
scripts/**,\
conformance/generated/**,\
conformance/reports/**,\
conformance/vectors/**,\
infra/**
sonar.test.exclusions=**/*
# Exclude test files from duplication detection. Parallel test suites
# (e.g. DB vs IndexedDB variants) legitimately duplicate large blocks; tests
# are already excluded from sonar.sources, coverage, and test analysis.
sonar.cpd.exclusions=**/eslint.config.js,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.man.test.ts,**/__test__/**,**/__tests__/**,**/test/**,**/tests/**,**/*.vectors.ts
sonar.javascript.lcov.reportPaths=packages/sdk/coverage/lcov.info,packages/helpers/did/coverage/lcov.info
