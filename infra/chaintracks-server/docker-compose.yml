# ChaintracksService with Bulk Headers CDN
#
# Quick Start:
#   docker compose up -d
#
# Services:
#   - ChaintracksService API: http://localhost:3011
#   - Bulk Headers CDN: http://localhost:3012
#
# Configuration:
#   Copy .env.docker to .env and customize if needed
#
# Documentation:
#   See DOCKER.md and README.md for complete information

services:
  chaintracks-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaintracks-server
    restart: unless-stopped
    ports:
      - '3011:3011' # ChaintracksService
      - '3012:3012' # CDN Server
    environment:
      # Chain configuration
      - CHAIN=${CHAIN:-main}
      - PORT=3011

      # Optional higher-limit key; anonymous fallback works without it.
      - WHATSONCHAIN_API_KEY=${WHATSONCHAIN_API_KEY:-}

      # Arcade/go-chaintracks source. Public defaults exist for main/test/ttn.
      - CHAINTRACKS_UPSTREAM_URL=${CHAINTRACKS_UPSTREAM_URL:-}
      - CHAINTRACKS_UPSTREAM_API_PREFIX=${CHAINTRACKS_UPSTREAM_API_PREFIX:-}
      - CHAINTRACKS_UPSTREAM_MAX_HEADERS=${CHAINTRACKS_UPSTREAM_MAX_HEADERS:-1000}
      - CHAINTRACKS_DISABLE_WHATSONCHAIN=${CHAINTRACKS_DISABLE_WHATSONCHAIN:-false}
      - STN_ARCADE_URL=${STN_ARCADE_URL:-}
      - STN_CHAINTRACKS_URL=${STN_CHAINTRACKS_URL:-}
      - TSTN_ARCADE_URL=${TSTN_ARCADE_URL:-}
      - TSTN_CHAINTRACKS_URL=${TSTN_CHAINTRACKS_URL:-}
      - ROUTING_PREFIX=${ROUTING_PREFIX:-}

      # Source CDN - Where to download headers FROM if local files don't exist
      # Use `${SOURCE_CDN_URL-...}` so an explicitly empty value disables it.
      - SOURCE_CDN_URL=${SOURCE_CDN_URL-https://cdn.projectbabbage.com/blockheaders/}
      - CHAINTRACKS_BULK_FILE_CACHE=${CHAINTRACKS_BULK_FILE_CACHE:-true}
      - CHAINTRACKS_UPSTREAM_DOWNLOAD_MAX_BYTES_PER_HOUR=${CHAINTRACKS_UPSTREAM_DOWNLOAD_MAX_BYTES_PER_HOUR:-536870912}
      - CHAINTRACKS_HISTORICAL_RATE_LIMIT_WINDOW_MS=${CHAINTRACKS_HISTORICAL_RATE_LIMIT_WINDOW_MS:-60000}
      - CHAINTRACKS_HISTORICAL_RATE_LIMIT_MAX=${CHAINTRACKS_HISTORICAL_RATE_LIMIT_MAX:-600}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}

      # Bulk Headers CDN - Enable hosting
      - ENABLE_BULK_HEADERS_CDN=${ENABLE_BULK_HEADERS_CDN:-true}

      # CDN Host URL - Public URL where YOUR CDN is accessible
      # Change this to your domain in production
      - CDN_HOST_URL=${CDN_HOST_URL:-http://localhost:3012}

      # Bulk headers storage path
      - BULK_HEADERS_PATH=/app/public/headers

      # Auto-export interval (67 hours = 400 blocks)
      - BULK_HEADERS_AUTO_EXPORT_INTERVAL=${BULK_HEADERS_AUTO_EXPORT_INTERVAL:-240000000}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Public browser access by default; exact allowlists are opt-in.
      - CHAINTRACKS_CORS_MODE=${CHAINTRACKS_CORS_MODE:-}
      - CHAINTRACKS_CORS_ALLOWED_ORIGINS=${CHAINTRACKS_CORS_ALLOWED_ORIGINS:-}
      - CHAINTRACKS_CORS_ALLOWED_HEADERS=${CHAINTRACKS_CORS_ALLOWED_HEADERS:-}
      - CHAINTRACKS_CORS_EXPOSED_HEADERS=${CHAINTRACKS_CORS_EXPOSED_HEADERS:-}
      - CHAINTRACKS_CDN_CORS_MODE=${CHAINTRACKS_CDN_CORS_MODE:-}
      - CHAINTRACKS_CDN_CORS_ALLOWED_ORIGINS=${CHAINTRACKS_CDN_CORS_ALLOWED_ORIGINS:-}
      - CHAINTRACKS_CDN_CORS_ALLOWED_HEADERS=${CHAINTRACKS_CDN_CORS_ALLOWED_HEADERS:-}
      - CHAINTRACKS_CDN_CORS_EXPOSED_HEADERS=${CHAINTRACKS_CDN_CORS_EXPOSED_HEADERS:-}
      - CHAINTRACKS_CONTENT_SECURITY_POLICY=${CHAINTRACKS_CONTENT_SECURITY_POLICY:-}
      - CHAINTRACKS_CROSS_ORIGIN_RESOURCE_POLICY=${CHAINTRACKS_CROSS_ORIGIN_RESOURCE_POLICY:-}
      - CHAINTRACKS_CROSS_ORIGIN_OPENER_POLICY=${CHAINTRACKS_CROSS_ORIGIN_OPENER_POLICY:-}
      - CHAINTRACKS_FRAME_OPTIONS=${CHAINTRACKS_FRAME_OPTIONS:-}
      - CHAINTRACKS_PERMISSIONS_POLICY=${CHAINTRACKS_PERMISSIONS_POLICY:-}
      - CHAINTRACKS_STRICT_TRANSPORT_SECURITY=${CHAINTRACKS_STRICT_TRANSPORT_SECURITY:-}
      - CHAINTRACKS_CDN_CONTENT_SECURITY_POLICY=${CHAINTRACKS_CDN_CONTENT_SECURITY_POLICY:-}
      - CHAINTRACKS_CDN_CROSS_ORIGIN_RESOURCE_POLICY=${CHAINTRACKS_CDN_CROSS_ORIGIN_RESOURCE_POLICY:-}
      - CHAINTRACKS_CDN_CROSS_ORIGIN_OPENER_POLICY=${CHAINTRACKS_CDN_CROSS_ORIGIN_OPENER_POLICY:-}
      - CHAINTRACKS_CDN_FRAME_OPTIONS=${CHAINTRACKS_CDN_FRAME_OPTIONS:-}
      - CHAINTRACKS_CDN_PERMISSIONS_POLICY=${CHAINTRACKS_CDN_PERMISSIONS_POLICY:-}
      - CHAINTRACKS_CDN_STRICT_TRANSPORT_SECURITY=${CHAINTRACKS_CDN_STRICT_TRANSPORT_SECURITY:-}

      # OpenTelemetry — point at any OTLP/HTTP collector. Unset => console exporters.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chaintracks-server}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}

    volumes:
      # Persist bulk headers across container restarts
      - bulk-headers:/app/public/headers

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider "http://localhost:3011$${ROUTING_PREFIX:-}/readyz"'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

volumes:
  # Named volume to persist bulk headers
  bulk-headers:
    driver: local
