apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kompose.cmd: kompose convert -o deploy/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: janitor
  name: janitor
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            io.kompose.service: janitor
        spec:
          containers:
            - name: janitor
              image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
              env:
                - name: ADMIN_TOKEN
                  value: ""
              command:
                - /bin/sh
                - -c
                - |
                  curl -X POST -H "Authorization: Bearer ${ADMIN_TOKEN}" http://app:3000/admin/janitor
          restartPolicy: OnFailure
