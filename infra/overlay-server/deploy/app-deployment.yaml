apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -o deploy/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -o deploy/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: app
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - npm
            - run
            - start
          env:
            - name: KNEX_URL
              valueFrom:
                secretKeyRef:
                  name: overlay-secrets
                  key: knex-url
            - name: MONGO_URL
              value: mongodb://root:example@mongodb:27017
            - name: SERVER_PRIVATE_KEY
              value: ""
            - name: ARC_API_KEY
              value: ""
            - name: HOSTING_URL
              value: ""
            - name: ADMIN_TOKEN
              value: ""
          image: ghcr.io/bsv-blockchain/overlay-server:v2.1.18@sha256:11e6c1ba404fec9c4ad300e5c3e0e21dce3f1ceddbba733c7ecce57801645fa9
          name: overlay
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 512Mi
              ephemeral-storage: 2Gi
      restartPolicy: Always
