NODE_ENV: "production"
BSV_NETWORK: "main" # main | test | ttn | tstn | mock
ENABLE_NGINX: "true"
HTTP_PORT: "8080"
SERVER_PRIVATE_KEY: "<PRIVATE_KEY_HEX_STRING>"
KNEX_DB_CONNECTION: '{"host": "<HOST>", "user": "wallet_admin", "password": "<ANOTHER_SECURE_PASS>", "database": "wallet_storage", "port": 3306}'

# tstn (Teranode Scaling Test Net) service endpoints. Required only when BSV_NETWORK=tstn.
# These are private, per-deployment URLs (not public) and are supplied at runtime.
# tstn runs Arcade (broadcast + merkle proofs) and ChainTracks (headers) only; it has no
# WhatsOnChain / block-explorer service. TSTN_CHAINTRACKS_URL defaults to
# "${TSTN_ARCADE_URL}/chaintracks/v1" when omitted.
# TSTN_ARCADE_URL: "<https://arcade-host>"
# TSTN_CHAINTRACKS_URL: "<https://chaintracks-host>"