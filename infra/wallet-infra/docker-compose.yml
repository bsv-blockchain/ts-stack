services:
  utxo-management-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utxo-management-server
    restart: always
    ports:
      - "8080:8080"        # Map host:8080 to container:8080 (Node server)
    # volumes:
      # Optional: mount your local code so changes reflect without rebuilding
      # - .:/app
      # If you do volume-mount your source code, be careful not to overwrite /app/node_modules
      # e.g. add a named volume for node_modules or rely on "npm install" inside container.
    environment:
      NODE_ENV: development
      BSV_NETWORK: "main"
      FEE_MODEL: "{\"model\":\"sat/kb\",\"value\":100}"
      COMMISSION_FEE: 0
      HTTP_PORT: "8080"
      SERVER_PRIVATE_KEY: "${SERVER_PRIVATE_KEY:?Set SERVER_PRIVATE_KEY to a dedicated local-only key}"
      WALLET_STORAGE_CORS_MODE: ${WALLET_STORAGE_CORS_MODE:-}
      WALLET_STORAGE_CORS_ALLOWED_ORIGINS: ${WALLET_STORAGE_CORS_ALLOWED_ORIGINS:-}
      WALLET_STORAGE_CORS_ALLOWED_HEADERS: ${WALLET_STORAGE_CORS_ALLOWED_HEADERS:-}
      WALLET_STORAGE_CORS_EXPOSED_HEADERS: ${WALLET_STORAGE_CORS_EXPOSED_HEADERS:-}
      WALLET_STORAGE_CONTENT_SECURITY_POLICY: ${WALLET_STORAGE_CONTENT_SECURITY_POLICY:-}
      WALLET_STORAGE_CROSS_ORIGIN_RESOURCE_POLICY: ${WALLET_STORAGE_CROSS_ORIGIN_RESOURCE_POLICY:-}
      WALLET_STORAGE_CROSS_ORIGIN_OPENER_POLICY: ${WALLET_STORAGE_CROSS_ORIGIN_OPENER_POLICY:-}
      WALLET_STORAGE_FRAME_OPTIONS: ${WALLET_STORAGE_FRAME_OPTIONS:-}
      WALLET_STORAGE_PERMISSIONS_POLICY: ${WALLET_STORAGE_PERMISSIONS_POLICY:-}
      WALLET_STORAGE_STRICT_TRANSPORT_SECURITY: ${WALLET_STORAGE_STRICT_TRANSPORT_SECURITY:-}
      # Fill in the DB credentials as a JSON object or direct URL
      KNEX_DB_CONNECTION: '{"host":"mysql","user":"root","password":"rootPass","database":"wallet_storage","port":3306}'
      # OpenTelemetry — point at any OTLP/HTTP collector. Unset => console exporters.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wallet-infra}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-development}

    depends_on:
      - mysql   # ensures MySQL starts before the Node service tries to connect

  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    container_name: mysql
    environment:
      MYSQL_DATABASE: wallet_storage
      MYSQL_ROOT_PASSWORD: rootPass 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
