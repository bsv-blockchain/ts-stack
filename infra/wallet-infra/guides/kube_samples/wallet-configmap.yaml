apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config

data:
  NODE_ENV: 'production'
  HTTP_PORT: '8080'
  BSV_NETWORK: 'main'
  ENABLE_NGINX: 'false'
  WALLET_STORAGE_BIND_HOST: '0.0.0.0'
  WALLET_STORAGE_TRUST_PROXY_HOPS: '1'
  WALLET_STORAGE_MONITOR_START_TASKS: 'true'
  WALLET_STORAGE_MONITOR_STARTUP_TASK_MODE: 'default'
  WALLET_STORAGE_MONITOR_ADMIN_ENABLED: 'false'
  WALLET_STORAGE_MANAGED_CHANGE_MAX_OUTPUTS_PER_ACTION: '8'
  WALLET_STORAGE_MANAGED_CHANGE_MIGRATION_INPUTS_PER_ACTION: '4'
  WALLET_STORAGE_MANAGED_CHANGE_PENDING_COMPARISON_INPUTS: '16'
