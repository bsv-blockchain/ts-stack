apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    ts-stack.bsvblockchain.org/workload-class: example-not-production
  labels:
    service: mysql
    app: wab
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: wab-config
                  key: db-name
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wab-secrets
                  key: db-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wab-secrets
                  key: mysql-root-password
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: wab-config
                  key: db-user
          image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
          name: mysql
          ports:
            - containerPort: 3306
              name: mysql
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: db-data
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
