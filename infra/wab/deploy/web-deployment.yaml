apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: web
    app: wab
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      automountServiceAccountToken: false
      containers:
        # General image from infra-release.yaml (GHCR). Pin to a released v* tag.
        - image: ghcr.io/bsv-blockchain/wab:v1.4.10@sha256:b770900fcdfd151eca342d0e3d9b1ed49dc987f961b68d38e112f136d1fe10e5
          env:
          - name: DB_CLIENT
            value: mysql2
          - name: DB_USER
            value: exampleuser
          - name: DB_PASS
            value: examplepass
          - name: DB_NAME
            value: exampledb
          - name: DB_HOST
            value: mysql
          name: web
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 512Mi
              ephemeral-storage: 2Gi
      restartPolicy: Always
