services:
  web:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DEV_CONSOLE_AUTH_METHOD_ENABLED: ${DEV_CONSOLE_AUTH_METHOD_ENABLED:-false}
      DB_CLIENT: mysql2
      DB_USER: app
      DB_PASS: pass1234
      DB_NAME: app
      DB_HOST: mysql
      DB_PORT: 3306
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      SERVER_PRIVATE_KEY: "${SERVER_PRIVATE_KEY:?Set SERVER_PRIVATE_KEY to a dedicated local-only key}"
      STORAGE_URL: ${STORAGE_URL}
      WAB_CORS_MODE: ${WAB_CORS_MODE:-}
      WAB_CORS_ALLOWED_ORIGINS: ${WAB_CORS_ALLOWED_ORIGINS:-}
      WAB_CORS_ALLOWED_HEADERS: ${WAB_CORS_ALLOWED_HEADERS:-}
      WAB_CORS_EXPOSED_HEADERS: ${WAB_CORS_EXPOSED_HEADERS:-}
      WAB_CONTENT_SECURITY_POLICY: ${WAB_CONTENT_SECURITY_POLICY:-}
      WAB_CROSS_ORIGIN_RESOURCE_POLICY: ${WAB_CROSS_ORIGIN_RESOURCE_POLICY:-}
      WAB_CROSS_ORIGIN_OPENER_POLICY: ${WAB_CROSS_ORIGIN_OPENER_POLICY:-}
      WAB_FRAME_OPTIONS: ${WAB_FRAME_OPTIONS:-}
      WAB_PERMISSIONS_POLICY: ${WAB_PERMISSIONS_POLICY:-}
      WAB_STRICT_TRANSPORT_SECURITY: ${WAB_STRICT_TRANSPORT_SECURITY:-}
      # OpenTelemetry — point at any OTLP/HTTP collector. Unset => console exporters.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wab-server}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-ppass1234"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

volumes:
  db_data:
