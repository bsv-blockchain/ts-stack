networks:
  babnet:
    ipam:
      config:
        - subnet: 172.20.0.0/23

services:
  uhrp-server:
    hostname: 'uhrp-server'
    build: .
    # volumes:
    #     - ".:/app"
    #   - "./src:/app/src"
    ports:
      - "8080:8080"
      - "9229:9229"
    networks:
      - babnet
    environment:
      NODE_ENV: 'development'
      HOSTING_DOMAIN: 'http://localhost:8080'
      WALLET_STORAGE_URL: 'https://store-us-1.bsvb.tech'
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Set ADMIN_TOKEN to at least 32 random characters}"
      HTTP_PORT: 8080
      PRICE_PER_GB_MO: 0.03
      SERVER_PRIVATE_KEY: "${SERVER_PRIVATE_KEY:?Set SERVER_PRIVATE_KEY to a dedicated local-only key}"
      UHRP_CORS_MODE: ${UHRP_CORS_MODE:-}
      UHRP_CORS_ALLOWED_ORIGINS: ${UHRP_CORS_ALLOWED_ORIGINS:-}
      UHRP_CORS_ALLOWED_HEADERS: ${UHRP_CORS_ALLOWED_HEADERS:-}
      UHRP_CORS_EXPOSED_HEADERS: ${UHRP_CORS_EXPOSED_HEADERS:-}
      UHRP_CONTENT_SECURITY_POLICY: ${UHRP_CONTENT_SECURITY_POLICY:-}
      UHRP_CROSS_ORIGIN_RESOURCE_POLICY: ${UHRP_CROSS_ORIGIN_RESOURCE_POLICY:-}
      UHRP_CROSS_ORIGIN_OPENER_POLICY: ${UHRP_CROSS_ORIGIN_OPENER_POLICY:-}
      UHRP_FRAME_OPTIONS: ${UHRP_FRAME_OPTIONS:-}
      UHRP_PERMISSIONS_POLICY: ${UHRP_PERMISSIONS_POLICY:-}
      UHRP_STRICT_TRANSPORT_SECURITY: ${UHRP_STRICT_TRANSPORT_SECURITY:-}
      MIN_HOSTING_MINUTES: 15
      GCP_BUCKET_NAME: 'uhrp'
      GCP_PROJECT_ID: 'uhrp'
      GOOGLE_APPLICATION_CREDENTIALS: '/app/service-account.json'
      # OpenTelemetry — point at any OTLP/HTTP collector. Unset => console exporters.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-uhrp-server-cloud-bucket}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-development}
    # Direct node invocation with the OTel preload (image has no npm; see Dockerfile).
    command: ["node", "--require", "./out/src/telemetry.js", "--max-http-header-size=512000", "out/src/index.js"]
