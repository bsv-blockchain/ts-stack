# Unified local stack for the BSV infra components.
#
#   docker compose -f infra/docker-compose.yaml up --build
#
# Traefik fronts everything on :80 and routes by hostname:
#   http://overlay.localhost       -> overlay-server
#   http://wallet.localhost        -> wallet-infra
#   http://messagebox.localhost    -> message-box-server
#   http://chaintracks.localhost   -> chaintracks-server
#   http://wab.localhost           -> wab
#   http://uhrp.localhost          -> uhrp-server-basic
#   http://traefik.localhost:8080  -> Traefik dashboard
#
# Chromium/Firefox resolve *.localhost to 127.0.0.1 automatically. Safari/curl on
# macOS do not — add the hosts in infra/LOCAL_STACK.md to /etc/hosts.
#
# Passwords below are for LOCAL DEV ONLY. Export distinct
# OVERLAY_SERVER_PRIVATE_KEY, WALLET_SERVER_PRIVATE_KEY,
# MESSAGE_BOX_SERVER_PRIVATE_KEY, WAB_SERVER_PRIVATE_KEY, and
# UHRP_SERVER_PRIVATE_KEY values plus an OVERLAY_ADMIN_TOKEN before startup.
# No private key or administrative token is checked in. Point telemetry at
# your collector with OTEL_EXPORTER_OTLP_ENDPOINT (unset => console exporters).

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  DEPLOY_ENV: ${DEPLOY_ENV:-development}

services:
  # ── Reverse proxy / router ─────────────────────────────────
  traefik:
    image: traefik:v3.5.6@sha256:16acb89c6db341182970d6fdafece31303b0a380a8ed7aa51682e225229bf1d2
    # File provider (not docker): the local daemon rejects Traefik's docker API
    # calls with a bare 400, so routes are declared in local/traefik/dynamic.yml
    # and point at each service's Docker-network DNS name.
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard (http://localhost:8080)
    volumes:
      - ./local/traefik:/etc/traefik/dynamic:ro

  # ── Shared backing stores ──────────────────────────────────
  mysql:
    # Pinned to 8.0: `mysql:8` now resolves to 8.4, which removed the
    # --default-authentication-plugin option (and changes auth defaults).
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./local/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"   # host:3307 to avoid clashing with a local mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:6.0.28@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Application components ─────────────────────────────────
  overlay-server:
    build: ./overlay-server
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: overlay-server
      NODE_NAME: overlay-local
      NETWORK: main
      SERVER_PRIVATE_KEY: "${OVERLAY_SERVER_PRIVATE_KEY:?Set a dedicated local overlay key}"
      # https + a sub-domain of .localhost passes the advertiser's URI check
      # (it only rejects the bare host "localhost"). Routing is still plain http via Traefik.
      HOSTING_URL: https://overlay.localhost
      WALLET_STORAGE_URL: https://store-us-1.bsvb.tech
      ARC_API_KEY: local-dev
      ADMIN_TOKEN: "${OVERLAY_ADMIN_TOKEN:?Set a random local Overlay admin token of at least 32 characters}"
      GASP_ENABLED: "false"
      OVERLAY_CORS_MODE: ${OVERLAY_CORS_MODE:-}
      OVERLAY_CORS_ALLOWED_ORIGINS: ${OVERLAY_CORS_ALLOWED_ORIGINS:-}
      OVERLAY_CORS_ALLOWED_HEADERS: ${OVERLAY_CORS_ALLOWED_HEADERS:-}
      OVERLAY_CORS_EXPOSED_HEADERS: ${OVERLAY_CORS_EXPOSED_HEADERS:-}
      OVERLAY_CONTENT_SECURITY_POLICY: ${OVERLAY_CONTENT_SECURITY_POLICY:-}
      OVERLAY_CROSS_ORIGIN_RESOURCE_POLICY: ${OVERLAY_CROSS_ORIGIN_RESOURCE_POLICY:-}
      OVERLAY_CROSS_ORIGIN_OPENER_POLICY: ${OVERLAY_CROSS_ORIGIN_OPENER_POLICY:-}
      OVERLAY_FRAME_OPTIONS: ${OVERLAY_FRAME_OPTIONS:-}
      OVERLAY_PERMISSIONS_POLICY: ${OVERLAY_PERMISSIONS_POLICY:-}
      OVERLAY_STRICT_TRANSPORT_SECURITY: ${OVERLAY_STRICT_TRANSPORT_SECURITY:-}
      KNEX_URL: mysql://root:rootpass@mysql:3306/appdb
      MONGO_URL: mongodb://root:rootpass@mongo:27017

  wallet-infra:
    build: ./wallet-infra
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: wallet-infra
      NODE_ENV: development
      BSV_NETWORK: main
      ENABLE_NGINX: "false"
      HTTP_PORT: "8080"
      SERVER_PRIVATE_KEY: "${WALLET_SERVER_PRIVATE_KEY:?Set a dedicated local wallet key}"
      WALLET_STORAGE_CORS_MODE: ${WALLET_STORAGE_CORS_MODE:-}
      WALLET_STORAGE_CORS_ALLOWED_ORIGINS: ${WALLET_STORAGE_CORS_ALLOWED_ORIGINS:-}
      WALLET_STORAGE_CORS_ALLOWED_HEADERS: ${WALLET_STORAGE_CORS_ALLOWED_HEADERS:-}
      WALLET_STORAGE_CORS_EXPOSED_HEADERS: ${WALLET_STORAGE_CORS_EXPOSED_HEADERS:-}
      WALLET_STORAGE_CONTENT_SECURITY_POLICY: ${WALLET_STORAGE_CONTENT_SECURITY_POLICY:-}
      WALLET_STORAGE_CROSS_ORIGIN_RESOURCE_POLICY: ${WALLET_STORAGE_CROSS_ORIGIN_RESOURCE_POLICY:-}
      WALLET_STORAGE_CROSS_ORIGIN_OPENER_POLICY: ${WALLET_STORAGE_CROSS_ORIGIN_OPENER_POLICY:-}
      WALLET_STORAGE_FRAME_OPTIONS: ${WALLET_STORAGE_FRAME_OPTIONS:-}
      WALLET_STORAGE_PERMISSIONS_POLICY: ${WALLET_STORAGE_PERMISSIONS_POLICY:-}
      WALLET_STORAGE_STRICT_TRANSPORT_SECURITY: ${WALLET_STORAGE_STRICT_TRANSPORT_SECURITY:-}
      FEE_MODEL: '{"model":"sat/kb","value":100}'
      COMMISSION_FEE: "0"
      KNEX_DB_CONNECTION: '{"host":"mysql","user":"root","password":"rootpass","database":"wallet_storage","port":3306}'

  message-box-server:
    build: ./message-box-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: message-box-server
      NODE_ENV: development
      PORT: "8080"
      HOSTING_DOMAIN: http://messagebox.localhost
      SERVER_PRIVATE_KEY: "${MESSAGE_BOX_SERVER_PRIVATE_KEY:?Set a dedicated local Message Box key}"
      MESSAGE_BOX_CORS_MODE: ${MESSAGE_BOX_CORS_MODE:-}
      MESSAGE_BOX_CORS_ALLOWED_ORIGINS: ${MESSAGE_BOX_CORS_ALLOWED_ORIGINS:-}
      MESSAGE_BOX_CORS_ALLOWED_HEADERS: ${MESSAGE_BOX_CORS_ALLOWED_HEADERS:-}
      MESSAGE_BOX_CORS_EXPOSED_HEADERS: ${MESSAGE_BOX_CORS_EXPOSED_HEADERS:-}
      MESSAGE_BOX_CONTENT_SECURITY_POLICY: ${MESSAGE_BOX_CONTENT_SECURITY_POLICY:-}
      MESSAGE_BOX_CROSS_ORIGIN_RESOURCE_POLICY: ${MESSAGE_BOX_CROSS_ORIGIN_RESOURCE_POLICY:-}
      MESSAGE_BOX_CROSS_ORIGIN_OPENER_POLICY: ${MESSAGE_BOX_CROSS_ORIGIN_OPENER_POLICY:-}
      MESSAGE_BOX_FRAME_OPTIONS: ${MESSAGE_BOX_FRAME_OPTIONS:-}
      MESSAGE_BOX_PERMISSIONS_POLICY: ${MESSAGE_BOX_PERMISSIONS_POLICY:-}
      MESSAGE_BOX_STRICT_TRANSPORT_SECURITY: ${MESSAGE_BOX_STRICT_TRANSPORT_SECURITY:-}
      KNEX_DB_CLIENT: mysql2
      KNEX_DB_CONNECTION: '{"port":3306,"host":"mysql","user":"root","password":"rootpass","database":"messagebox-backend"}'
      WALLET_STORAGE_URL: https://storage.babbage.systems

  chaintracks-server:
    build: ./chaintracks-server
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: chaintracks-server
      CHAIN: main
      PORT: "3011"
      CHAINTRACKS_CORS_MODE: ${CHAINTRACKS_CORS_MODE:-}
      CHAINTRACKS_CORS_ALLOWED_ORIGINS: ${CHAINTRACKS_CORS_ALLOWED_ORIGINS:-}
      CHAINTRACKS_CORS_ALLOWED_HEADERS: ${CHAINTRACKS_CORS_ALLOWED_HEADERS:-}
      CHAINTRACKS_CORS_EXPOSED_HEADERS: ${CHAINTRACKS_CORS_EXPOSED_HEADERS:-}
      CHAINTRACKS_CONTENT_SECURITY_POLICY: ${CHAINTRACKS_CONTENT_SECURITY_POLICY:-}
      CHAINTRACKS_CROSS_ORIGIN_RESOURCE_POLICY: ${CHAINTRACKS_CROSS_ORIGIN_RESOURCE_POLICY:-}
      CHAINTRACKS_CROSS_ORIGIN_OPENER_POLICY: ${CHAINTRACKS_CROSS_ORIGIN_OPENER_POLICY:-}
      CHAINTRACKS_FRAME_OPTIONS: ${CHAINTRACKS_FRAME_OPTIONS:-}
      CHAINTRACKS_PERMISSIONS_POLICY: ${CHAINTRACKS_PERMISSIONS_POLICY:-}
      CHAINTRACKS_STRICT_TRANSPORT_SECURITY: ${CHAINTRACKS_STRICT_TRANSPORT_SECURITY:-}
      ENABLE_BULK_HEADERS_CDN: "false"
      # Remote CDN headers are downloaded FROM here; required by the bulk
      # ingestor even when this node isn't hosting its own CDN.
      SOURCE_CDN_URL: https://chaintracks-cdn-us-1.bsvb.tech/blockheaders/
      WHATSONCHAIN_API_KEY: ""

  wab:
    build: ./wab
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: wab-server
      # production => knexfile uses mysql2 + DB_* below (development is hardcoded sqlite).
      NODE_ENV: production
      PORT: "8080"
      DB_CLIENT: mysql2
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: rootpass
      DB_NAME: app
      DEV_CONSOLE_AUTH_METHOD_ENABLED: "false"
      SERVER_PRIVATE_KEY: "${WAB_SERVER_PRIVATE_KEY:?Set a dedicated local WAB key}"
      WAB_CORS_MODE: ${WAB_CORS_MODE:-}
      WAB_CORS_ALLOWED_ORIGINS: ${WAB_CORS_ALLOWED_ORIGINS:-}
      WAB_CORS_ALLOWED_HEADERS: ${WAB_CORS_ALLOWED_HEADERS:-}
      WAB_CORS_EXPOSED_HEADERS: ${WAB_CORS_EXPOSED_HEADERS:-}
      WAB_CONTENT_SECURITY_POLICY: ${WAB_CONTENT_SECURITY_POLICY:-}
      WAB_CROSS_ORIGIN_RESOURCE_POLICY: ${WAB_CROSS_ORIGIN_RESOURCE_POLICY:-}
      WAB_CROSS_ORIGIN_OPENER_POLICY: ${WAB_CROSS_ORIGIN_OPENER_POLICY:-}
      WAB_FRAME_OPTIONS: ${WAB_FRAME_OPTIONS:-}
      WAB_PERMISSIONS_POLICY: ${WAB_PERMISSIONS_POLICY:-}
      WAB_STRICT_TRANSPORT_SECURITY: ${WAB_STRICT_TRANSPORT_SECURITY:-}
      STORAGE_URL: https://store-us-1.bsvb.tech

  uhrp-server-basic:
    build: ./uhrp-server-basic
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: uhrp-server-basic
      NODE_ENV: development
      HTTP_PORT: "8080"
      SERVER_PRIVATE_KEY: "${UHRP_SERVER_PRIVATE_KEY:?Set a dedicated local UHRP key}"
      UHRP_CORS_MODE: ${UHRP_CORS_MODE:-}
      UHRP_CORS_ALLOWED_ORIGINS: ${UHRP_CORS_ALLOWED_ORIGINS:-}
      UHRP_CORS_ALLOWED_HEADERS: ${UHRP_CORS_ALLOWED_HEADERS:-}
      UHRP_CORS_EXPOSED_HEADERS: ${UHRP_CORS_EXPOSED_HEADERS:-}
      UHRP_CONTENT_SECURITY_POLICY: ${UHRP_CONTENT_SECURITY_POLICY:-}
      UHRP_CROSS_ORIGIN_RESOURCE_POLICY: ${UHRP_CROSS_ORIGIN_RESOURCE_POLICY:-}
      UHRP_CROSS_ORIGIN_OPENER_POLICY: ${UHRP_CROSS_ORIGIN_OPENER_POLICY:-}
      UHRP_FRAME_OPTIONS: ${UHRP_FRAME_OPTIONS:-}
      UHRP_PERMISSIONS_POLICY: ${UHRP_PERMISSIONS_POLICY:-}
      UHRP_STRICT_TRANSPORT_SECURITY: ${UHRP_STRICT_TRANSPORT_SECURITY:-}
      WALLET_STORAGE_URL: https://store-us-1.bsvb.tech

volumes:
  mysql_data:
  mongo_data:
